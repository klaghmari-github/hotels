v_hotel_holidays_features:
  type: view
  mode: create_or_replace
  requires:
    - t_hotel_holidays_data
  sql: |-
    SELECT
      CAST(hotel_code AS VARCHAR) AS hotel_code,
      AVG(TRY_CAST(zone_scolaire_a AS DOUBLE)) AS hol_zone_scolaire_a,
      AVG(TRY_CAST(zone_scolaire_b AS DOUBLE)) AS hol_zone_scolaire_b,
      AVG(TRY_CAST(zone_scolaire_c AS DOUBLE)) AS hol_zone_scolaire_c,
      AVG(TRY_CAST(nb_jours_dans_mois AS DOUBLE)) AS hol_nb_jours_dans_mois,
      AVG(TRY_CAST(nb_jours_feries AS DOUBLE)) AS hol_nb_jours_feries,
      AVG(TRY_CAST(nb_jours_weekend AS DOUBLE)) AS hol_nb_jours_weekend,
      AVG(TRY_CAST(nb_jours_vacances_scolaires AS DOUBLE)) AS hol_nb_jours_vacances_scolaires,
      AVG(TRY_CAST(nb_jours_vacances_hors_feries AS DOUBLE)) AS hol_nb_jours_vacances_hors_feries,
      AVG(TRY_CAST(nb_jours_holidays AS DOUBLE)) AS hol_nb_jours_holidays,
      AVG(TRY_CAST(pct_jours_holidays AS DOUBLE)) AS hol_pct_jours_holidays
    FROM t_hotel_holidays_data
    WHERE hotel_code IS NOT NULL
    GROUP BY CAST(hotel_code AS VARCHAR)

# create_if_not_exists : materialise une fois (run.py warm), puis le web lit direct.
# Pour forcer le rebuild : python run.py warm --rebuild
t_rich_data:
  type: table
  mode: create_if_not_exists
  requires:
    - v_ml_training_dataset
    - v_hotel_data_features
    - v_hotel_proximity_features
    - v_hotel_weather_features
    - v_hotel_holidays_features
  sql: |-
    SELECT
      m.*,
      hd.* EXCLUDE (hotel_code),
      px.* EXCLUDE (hotel_code),
      wx.* EXCLUDE (hotel_code),
      hol.* EXCLUDE (hotel_code)
    FROM v_ml_training_dataset AS m
    LEFT JOIN v_hotel_data_features AS hd
      ON CAST(m.hotel_code AS VARCHAR) = hd.hotel_code
    LEFT JOIN v_hotel_proximity_features AS px
      ON CAST(m.hotel_code AS VARCHAR) = px.hotel_code
    LEFT JOIN v_hotel_weather_features AS wx
      ON CAST(m.hotel_code AS VARCHAR) = wx.hotel_code
    LEFT JOIN v_hotel_holidays_features AS hol
      ON CAST(m.hotel_code AS VARCHAR) = hol.hotel_code

v_web_rich_data:
  type: view
  mode: create_or_replace
  requires:
    - t_rich_data
  sql: |-
    SELECT
      hotel_code,
      solution,
      is_observation,
      hotel_nb_chambres,
      hotel_to_annuel,
      hotel_guests_per_chambre,
      metres_lineaires,
      montant_ventes_par_mois,
      montant_marge_selon_coef_par_mois
    FROM t_rich_data
