      AVG(TRY_CAST(meteo_vent_kmh_max AS DOUBLE)) AS wx_meteo_vent_kmh_max,
      AVG(TRY_CAST(meteo_pression_hpa_mean AS DOUBLE)) AS wx_meteo_pression_hpa_mean,
