v_hotel_weather_features:
  type: view
  mode: create_or_replace
  requires:
    - t_hotel_weather_data
  sql: |-
    SELECT
      CAST(hotel_code AS VARCHAR) AS hotel_code,
      AVG(TRY_CAST(meteo_temperature_c_mean AS DOUBLE)) AS wx_meteo_temperature_c_mean,
      AVG(TRY_CAST(meteo_temperature_c_min AS DOUBLE)) AS wx_meteo_temperature_c_min,
      AVG(TRY_CAST(meteo_temperature_c_max AS DOUBLE)) AS wx_meteo_temperature_c_max,
      AVG(TRY_CAST(meteo_point_rosee_c_mean AS DOUBLE)) AS wx_meteo_point_rosee_c_mean,
      AVG(TRY_CAST(meteo_point_rosee_c_min AS DOUBLE)) AS wx_meteo_point_rosee_c_min,
      AVG(TRY_CAST(meteo_point_rosee_c_max AS DOUBLE)) AS wx_meteo_point_rosee_c_max,
      AVG(TRY_CAST(meteo_humidite_pct_mean AS DOUBLE)) AS wx_meteo_humidite_pct_mean,
      AVG(TRY_CAST(meteo_humidite_pct_min AS DOUBLE)) AS wx_meteo_humidite_pct_min,
      AVG(TRY_CAST(meteo_humidite_pct_max AS DOUBLE)) AS wx_meteo_humidite_pct_max,
      AVG(TRY_CAST(meteo_precipitations_mm_mean AS DOUBLE)) AS wx_meteo_precipitations_mm_mean,
      AVG(TRY_CAST(meteo_precipitations_mm_min AS DOUBLE)) AS wx_meteo_precipitations_mm_min,
      AVG(TRY_CAST(meteo_precipitations_mm_max AS DOUBLE)) AS wx_meteo_precipitations_mm_max,
      AVG(TRY_CAST(meteo_neige_mm_mean AS DOUBLE)) AS wx_meteo_neige_mm_mean,
      AVG(TRY_CAST(meteo_neige_mm_min AS DOUBLE)) AS wx_meteo_neige_mm_min,
      AVG(TRY_CAST(meteo_neige_mm_max AS DOUBLE)) AS wx_meteo_neige_mm_max,
      AVG(TRY_CAST(meteo_vent_kmh_mean AS DOUBLE)) AS wx_meteo_vent_kmh_mean,
