# Dataset ML enrichi : simulations v2 + hotel_data + proximity + weather + holidays
# Jointure uniquement sur hotel_code. Sources multi-lignes (weather/holidays) moyennes par hotel.
# Colonnes externes prefixees (hd_/px_/wx_/hol_) pour eviter collisions.

