# Dataset ML pour la chaîne ml_tc → ml_tc_sim_v2 → ml_ca (un couple par solution).
# Cible ml_tc = taux_conversion RECALCULE par ligne (obs ET sim) :
#   nombre_ventes_par_mois / nombre_guests_par_mois
# Les scenarios simules ont donc un taux different de l'observation.
# Enrichissement sim_v2_brut + ml_tc_sim_v2 se fait côté Python (super_model.py).
# Features de jointure hotel-level :
#   - proximite geographique commerces concurrents (px_)
#   - meteo mensuelle moyennee par hotel (wx_ — AVG des mois)
#   - leviers hotel + mix type/gamme + m_lin (depuis pivot sim_v2)

v_ml_hotel_context:
  type: view
  mode: create_or_replace
  requires:
    - t_sales
  sql: |
    SELECT
      HOTEL_CODE AS hotel_code,
      MAX(HOTEL_NB_CHAMBRES)::DOUBLE AS hotel_nb_chambres,
      MAX(HOTEL_TO_ANNUEL)::DOUBLE AS hotel_to_annuel,
      MAX(HOTEL_GUESTS_PER_CHAMBRE)::DOUBLE AS hotel_guests_per_chambre
    FROM t_sales
    GROUP BY HOTEL_CODE

v_ml_training_dataset:
  type: view
  mode: create_or_replace
  requires:
    - t_dataset_pivot
    - v_ml_hotel_context
    - v_hotel_proximity_features
    - v_hotel_weather_features
  sql: |
    SELECT
      base.*,
      px.* EXCLUDE (hotel_code),
      wx.* EXCLUDE (hotel_code)
    FROM (
      SELECT
        p.scenario_id,
        p.hotel_code,
        p.solution,
        COALESCE(LEN(p.scenario_removed_natures), 0) = 0 AS is_observation,
        h.hotel_nb_chambres,
        h.hotel_to_annuel,
        h.hotel_guests_per_chambre,
        p.metres_lineaires,
        p.nombre_guests_par_mois,
        p.nombre_ventes_par_mois,
        -- cible XGBoost : recalculee pour chaque scenario (obs + sim)
        p.nombre_ventes_par_mois
          / NULLIF(p.nombre_guests_par_mois, 0) AS taux_conversion,
        COLUMNS('^(type|gamme)_.*_part_natures$'),
        p.montant_ventes_par_mois,
        p.montant_marge_par_mois,
        p.montant_marge_selon_coef_par_mois
      FROM t_dataset_pivot AS p
      INNER JOIN v_ml_hotel_context AS h
        USING (hotel_code)
      WHERE CAST(p.hotel_code AS VARCHAR) NOT IN ('H5586', 'H6188')
    ) AS base
    LEFT JOIN v_hotel_proximity_features AS px
      ON CAST(px.hotel_code AS VARCHAR) = CAST(base.hotel_code AS VARCHAR)
    LEFT JOIN v_hotel_weather_features AS wx
      ON CAST(wx.hotel_code AS VARCHAR) = CAST(base.hotel_code AS VARCHAR)
