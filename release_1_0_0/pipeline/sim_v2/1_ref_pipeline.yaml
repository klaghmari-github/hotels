t_hotel_codes:
  type: table
  mode: create_if_not_exists
  requires:
  - t_sales
  sql: |
    SELECT DISTINCT HOTEL_CODE
    FROM t_sales
    WHERE CAST(HOTEL_CODE AS VARCHAR) NOT IN ('H5586')
    ORDER BY HOTEL_CODE
t_machines:
  type: table
  mode: create_if_not_exists
  requires:
  - t_sales
  sql: |
    SELECT DISTINCT MACHINE
    FROM t_sales
    WHERE MACHINE IS NOT NULL
    ORDER BY MACHINE
