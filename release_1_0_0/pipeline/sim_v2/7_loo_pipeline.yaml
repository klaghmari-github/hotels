# Hotels LOO = pilotes concepts AVEC tickets, solution = mapping metier (t_pilot_concepts)
# n_solution_hotels : si = 1 → eval biaisee (on ne sort pas l'hotel du train).
t_loo_hotels:
  type: table
  mode: create_or_replace
  requires:
  - t_sales
  - t_pilot_concepts
  sql: |-
    WITH base AS (
      SELECT
        p.hotel_code AS hotel_code,
        LOWER(TRIM(CAST(p.solution AS VARCHAR))) AS solution
      FROM t_pilot_concepts AS p
      INNER JOIN (
        SELECT DISTINCT CAST(HOTEL_CODE AS VARCHAR) AS hotel_code
        FROM t_sales
        WHERE CAST(HOTEL_CODE AS VARCHAR) NOT IN ('H5586', 'H6188')
      ) AS s
        ON s.hotel_code = CAST(p.hotel_code AS VARCHAR)
      WHERE CAST(p.hotel_code AS VARCHAR) NOT IN ('H5586', 'H6188')
    )
    SELECT
      hotel_code,
      solution,
      COUNT(*) OVER (PARTITION BY solution) AS n_solution_hotels,
      CASE
        WHEN COUNT(*) OVER (PARTITION BY solution) <= 1 THEN TRUE
        ELSE FALSE
      END AS eval_biased
    FROM base
    ORDER BY hotel_code
v_loo_training_source:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_simulation_long
  - t_loo_hotels
  sql: |-
    -- Train LOO = uniquement les hotels pilotes (t_loo_hotels), hors exclus.
    -- LOO strict si ≥2 hotels de la meme solution ; sinon garder l'hotel
    -- evalue dans le train (evaluation biaisee : simply / liberty).
    -- Connected (3 hotels) : exclusion reelle de l'hotel test.
    SELECT source.*
    FROM v_restitution_simulation_long AS source
    INNER JOIN t_loo_hotels AS pilots
      ON CAST(pilots.hotel_code AS VARCHAR) = CAST(source.hotel_code AS VARCHAR)
    CROSS JOIN v_loo_step AS step
    WHERE CAST(source.hotel_code AS VARCHAR) NOT IN ('H5586', 'H6188')
      AND (
        CASE
          WHEN COALESCE(step.eval_biased, FALSE)
            OR COALESCE(step.n_solution_hotels, 0) <= 1
          THEN TRUE
          ELSE CAST(source.hotel_code AS VARCHAR)
            <> CAST(step.hotel_code AS VARCHAR)
        END
      )
v_loo_solution_coefficients:
  type: view
  mode: create_or_replace
  requires:
  - v_loo_training_source
  sql: |-
    SELECT
      solution,
      variable_family,
      variable_name,
      AVG(montant_ventes_coefficient) AS montant_ventes_coefficient,
      AVG(montant_marge_selon_coef_coefficient) AS montant_marge_selon_coef_coefficient,
      AVG(montant_marge_coefficient) AS montant_marge_coefficient,
      COUNT(*) AS nombre_observations,
      COUNT(DISTINCT hotel_code) AS nombre_hotels
    FROM v_loo_training_source
    GROUP BY solution, variable_family, variable_name
v_loo_observed_row:
  type: view
  mode: create_or_replace
  requires:
  - t_dataset_pivot
  sql: |-
    SELECT p.*
    FROM t_dataset_pivot AS p
    CROSS JOIN v_loo_step AS step
    WHERE p.hotel_code = step.hotel_code
      AND COALESCE(LEN(p.scenario_removed_natures), 0) = 0
    LIMIT 1
v_loo_input_mix:
  type: view
  mode: create_or_replace
  requires:
  - v_loo_observed_row
  sql: |-
    WITH source AS (
      SELECT COLUMNS('^(type|gamme)_.*_part_natures$')
      FROM v_loo_observed_row
    ), long_mix AS (
      UNPIVOT source
      ON COLUMNS('^(type|gamme)_.*_part_natures$')
      INTO NAME variable_name VALUE target_part
    )
    SELECT
      CASE
        WHEN variable_name LIKE 'type_%' THEN 'type'
        WHEN variable_name LIKE 'gamme_%' THEN 'gamme'
      END AS variable_family,
      variable_name,
      target_part
    FROM long_mix
    WHERE target_part > 0
v_loo_prediction_by_variable:
  type: view
  mode: create_or_replace
  requires:
  - v_loo_solution_coefficients
  - v_loo_observed_row
  - v_loo_input_mix
  sql: |-
    SELECT
      o.hotel_code,
      o.solution,
      c.variable_family,
      c.variable_name,
      m.target_part,
      c.montant_ventes_coefficient
        * o.nombre_guests_par_mois * o.metres_lineaires * m.target_part
          AS montant_ventes_par_mois_predit,
      c.montant_marge_selon_coef_coefficient
        * o.nombre_guests_par_mois * o.metres_lineaires * m.target_part
          AS montant_marge_selon_coef_par_mois_predite,
      c.montant_marge_coefficient
        * o.nombre_guests_par_mois * o.metres_lineaires * m.target_part
          AS montant_marge_par_mois_predite,
      c.nombre_observations,
      c.nombre_hotels
    FROM v_loo_observed_row AS o
    INNER JOIN v_loo_solution_coefficients AS c
      ON c.solution = o.solution
    INNER JOIN v_loo_input_mix AS m
      USING (variable_family, variable_name)
# Agregation par famille de variables (ex-methode B), label public : sim_v2
v_loo_prediction:
  type: view
  mode: create_or_replace
  requires:
  - v_loo_prediction_by_variable
  sql: |-
    WITH family_prediction AS (
      SELECT
        hotel_code,
        solution,
        variable_family,
        AVG(montant_ventes_par_mois_predit) AS montant_ventes_par_mois_predit,
        AVG(montant_marge_selon_coef_par_mois_predite) AS montant_marge_selon_coef_par_mois_predite,
        AVG(montant_marge_par_mois_predite) AS montant_marge_par_mois_predite,
        COUNT(*) AS nombre_predicteurs,
        MAX(nombre_hotels) AS nombre_hotels_apprentissage
      FROM v_loo_prediction_by_variable
      GROUP BY hotel_code, solution, variable_family
    )
    SELECT
      hotel_code,
      solution,
      'sim_v2' AS methode,
      AVG(montant_ventes_par_mois_predit) AS montant_ventes_par_mois_predit,
      AVG(montant_marge_selon_coef_par_mois_predite) AS montant_marge_selon_coef_par_mois_predite,
      AVG(montant_marge_par_mois_predite) AS montant_marge_par_mois_predite,
      SUM(nombre_predicteurs) AS nombre_predicteurs,
      COUNT(*) AS nombre_familles,
      MAX(nombre_hotels_apprentissage) AS nombre_hotels_apprentissage
    FROM family_prediction
    GROUP BY hotel_code, solution
v_loo_result:
  type: view
  mode: create_or_replace
  requires:
  - v_loo_observed_row
  - v_loo_prediction
  - t_loo_hotels
  sql: |-
    SELECT
      p.hotel_code,
      p.solution,
      p.methode,
      COALESCE(h.eval_biased, FALSE) AS eval_biased,
      COALESCE(h.n_solution_hotels, 0) AS n_solution_hotels,
      o.nombre_guests_par_mois,
      o.metres_lineaires,
      o.montant_ventes_par_mois AS montant_ventes_par_mois_reel,
      p.montant_ventes_par_mois_predit,
      p.montant_ventes_par_mois_predit - o.montant_ventes_par_mois AS montant_ventes_erreur,
      ABS(p.montant_ventes_par_mois_predit - o.montant_ventes_par_mois) AS montant_ventes_erreur_absolue,
      ABS(p.montant_ventes_par_mois_predit - o.montant_ventes_par_mois)
        / NULLIF(ABS(o.montant_ventes_par_mois), 0) AS montant_ventes_erreur_relative,
      o.montant_marge_selon_coef_par_mois AS montant_marge_selon_coef_par_mois_reel,
      p.montant_marge_selon_coef_par_mois_predite,
      p.montant_marge_selon_coef_par_mois_predite - o.montant_marge_selon_coef_par_mois AS montant_marge_selon_coef_erreur,
      ABS(p.montant_marge_selon_coef_par_mois_predite - o.montant_marge_selon_coef_par_mois) AS montant_marge_selon_coef_erreur_absolue,
      ABS(p.montant_marge_selon_coef_par_mois_predite - o.montant_marge_selon_coef_par_mois)
        / NULLIF(ABS(o.montant_marge_selon_coef_par_mois), 0) AS montant_marge_selon_coef_erreur_relative,
      o.montant_marge_par_mois AS montant_marge_par_mois_reel,
      p.montant_marge_par_mois_predite,
      p.montant_marge_par_mois_predite - o.montant_marge_par_mois AS montant_marge_erreur,
      ABS(p.montant_marge_par_mois_predite - o.montant_marge_par_mois) AS montant_marge_erreur_absolue,
      ABS(p.montant_marge_par_mois_predite - o.montant_marge_par_mois)
        / NULLIF(ABS(o.montant_marge_par_mois), 0) AS montant_marge_erreur_relative,
      p.nombre_predicteurs,
      p.nombre_familles,
      p.nombre_hotels_apprentissage
    FROM v_loo_observed_row AS o
    INNER JOIN v_loo_prediction AS p
      USING (hotel_code, solution)
    LEFT JOIN t_loo_hotels AS h
      ON CAST(h.hotel_code AS VARCHAR) = CAST(p.hotel_code AS VARCHAR)
t_loo_results:
  type: table
  mode: create_if_not_exists
  requires:
  - v_loo_result
  sql: SELECT * FROM v_loo_result LIMIT 0
x_insert_loo_result:
  type: execute
  requires:
  - t_loo_results
  - v_loo_result
  sql: |-
    INSERT INTO t_loo_results BY NAME
    SELECT r.*
    FROM v_loo_result AS r
    WHERE NOT EXISTS (
      SELECT 1 FROM t_loo_results AS t
      WHERE t.hotel_code = r.hotel_code AND t.methode = r.methode
    )
i_loo_evaluation:
  type: iteration
  execution: sequential
  tasks: 1
  requires:
  - t_loo_hotels
  scenarios: t_loo_hotels
  step_view: v_loo_step
  target: x_insert_loo_result
  order_by:
  - hotel_code
v_loo_metrics:
  type: view
  mode: create_or_replace
  requires:
  - t_loo_results
  sql: |-
    SELECT
      methode,
      solution,
      COUNT(*) AS nombre_hotels,
      AVG(montant_ventes_erreur_absolue) AS montant_ventes_mae,
      SQRT(AVG(POWER(montant_ventes_erreur, 2))) AS montant_ventes_rmse,
      AVG(montant_ventes_erreur_relative) AS montant_ventes_mape,
      AVG(montant_ventes_erreur) AS montant_ventes_biais,
      AVG(montant_marge_selon_coef_erreur_absolue) AS marge_selon_coef_mae,
      SQRT(AVG(POWER(montant_marge_selon_coef_erreur, 2))) AS marge_selon_coef_rmse,
      AVG(montant_marge_selon_coef_erreur_relative) AS marge_selon_coef_mape,
      AVG(montant_marge_erreur_absolue) AS marge_mae,
      SQRT(AVG(POWER(montant_marge_erreur, 2))) AS marge_rmse,
      AVG(montant_marge_erreur_relative) AS marge_mape
    FROM t_loo_results
    WHERE methode = 'sim_v2'
    GROUP BY GROUPING SETS ((methode, solution), (methode))
v_loo_method_comparison:
  type: view
  mode: create_or_replace
  requires:
  - v_loo_metrics
  sql: |-
    SELECT
      methode,
      montant_ventes_mae,
      montant_ventes_rmse,
      montant_ventes_mape,
      marge_selon_coef_mae,
      marge_selon_coef_rmse,
      marge_selon_coef_mape,
      marge_mae,
      marge_rmse,
      marge_mape
    FROM v_loo_metrics
    WHERE solution IS NULL
    ORDER BY montant_ventes_mae
