v_restitution_simulation_long:
  type: view
  mode: create_or_replace
  requires:
  - t_dataset_pivot
  sql: |-
    WITH source AS (
      SELECT
        scenario_id,
        hotel_code,
        solution,
        nombre_guests_par_mois,
        metres_lineaires,
        montant_ventes_par_mois,
        montant_marge_selon_coef_par_mois,
        montant_marge_par_mois,
        COLUMNS('^(type|gamme)_.*_part_natures$')
      FROM t_dataset_pivot
    ), long_mix AS (
      UNPIVOT source
      ON COLUMNS('^(type|gamme)_.*_part_natures$')
      INTO NAME variable_name VALUE variable_part
    )
    SELECT
      scenario_id,
      hotel_code,
      solution,
      CASE
        WHEN variable_name LIKE 'type_%' THEN 'type'
        WHEN variable_name LIKE 'gamme_%' THEN 'gamme'
      END AS variable_family,
      variable_name,
      variable_part,
      nombre_guests_par_mois,
      metres_lineaires,
      montant_ventes_par_mois,
      montant_marge_selon_coef_par_mois,
      montant_marge_par_mois,
      montant_ventes_par_mois
        / NULLIF(nombre_guests_par_mois * metres_lineaires * variable_part, 0)
          AS montant_ventes_coefficient,
      montant_marge_selon_coef_par_mois
        / NULLIF(nombre_guests_par_mois * metres_lineaires * variable_part, 0)
          AS montant_marge_selon_coef_coefficient,
      montant_marge_par_mois
        / NULLIF(nombre_guests_par_mois * metres_lineaires * variable_part, 0)
          AS montant_marge_coefficient
    FROM long_mix
    WHERE variable_part > 0
      AND nombre_guests_par_mois > 0
      AND metres_lineaires > 0
v_restitution_training_source:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_simulation_long
  sql: SELECT * FROM v_restitution_simulation_long
v_restitution_solution_coefficients:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_training_source
  sql: |-
    SELECT
      solution,
      variable_family,
      variable_name,
      AVG(montant_ventes_coefficient) AS montant_ventes_coefficient,
      AVG(montant_marge_selon_coef_coefficient) AS montant_marge_selon_coef_coefficient,
      AVG(montant_marge_coefficient) AS montant_marge_coefficient,
      COUNT(*) AS nombre_observations,
      COUNT(DISTINCT hotel_code) AS nombre_hotels,
      STDDEV_SAMP(montant_ventes_coefficient) AS montant_ventes_coefficient_stddev,
      STDDEV_SAMP(montant_marge_selon_coef_coefficient) AS montant_marge_selon_coef_coefficient_stddev,
      STDDEV_SAMP(montant_marge_coefficient) AS montant_marge_coefficient_stddev
    FROM v_restitution_training_source
    GROUP BY solution, variable_family, variable_name
v_solution_conversion_rate:
  type: view
  mode: create_or_replace
  requires:
  - t_dataset_pivot
  sql: |-
    SELECT
      solution,
      AVG(nombre_ventes_par_mois / NULLIF(nombre_guests_par_mois, 0)) AS taux_conversion_moyen,
      SUM(nombre_ventes_par_mois) / NULLIF(SUM(nombre_guests_par_mois), 0) AS taux_conversion_pondere,
      COUNT(DISTINCT hotel_code) AS nombre_hotels
    FROM t_dataset_pivot
    WHERE COALESCE(LEN(scenario_removed_natures), 0) = 0
    GROUP BY solution
v_restitution_default_input_hotel:
  type: view
  mode: create_or_replace
  requires: []
  sql: |-
    SELECT
      200.0::DOUBLE AS hotel_nb_chambres,
      0.5::DOUBLE AS hotel_to_annuel,
      1.0::DOUBLE AS hotel_guests_per_chambre,
      10.0::DOUBLE AS metres_lineaires
v_restitution_default_input_mix:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_solution_coefficients
  sql: |-
    WITH variables AS (
      SELECT DISTINCT variable_family, variable_name
      FROM v_restitution_solution_coefficients
    ), counts AS (
      SELECT variable_family, COUNT(*) AS variable_count
      FROM variables
      GROUP BY variable_family
    )
    SELECT
      v.variable_family,
      v.variable_name,
      1.0 / c.variable_count AS target_part
    FROM variables AS v
    INNER JOIN counts AS c USING (variable_family)
