# Stage 2 — Reference LOO = moyenne des pairs (meme solution, hors hotel evalue)
# v_loo_step est une vue temporaire creee a chaque iteration (step_view).

t_solution_reference:
  type: table
  mode: create_or_replace
  requires:
    - v_hotel_params
    - t_pilot_defaults
  sql: |-
    SELECT
      p.solution,
      AVG(p.nb_chambres) AS nb_chambres,
      AVG(p.taux_occupation) AS to_rate,
      AVG(p.guests_per_chambre) AS guests,
      AVG(p.m_lin) AS m_lin,
      AVG(p.clients_mois) AS clients_mois,
      AVG(p.mix_fb) AS mix_fb,
      AVG(p.nb_ventes_mensuel) AS ventes,
      AVG(p.ca_reel_mensuel) AS ca_total,
      COUNT(DISTINCT p.hotel_code) AS nombre_hotels,
      ANY_VALUE(d.ca_fb) AS ca_fb_pilote,
      ANY_VALUE(d.ca_nfb) AS ca_nfb_pilote,
      ANY_VALUE(d.ventes) AS ventes_pilote,
      ANY_VALUE(d.clients_heb) AS clients_heb_pilote,
      ANY_VALUE(d.mix_fb) AS mix_fb_pilote,
      ANY_VALUE(d.ml_ref) AS ml_ref,
      ANY_VALUE(d.frigo_ref) AS frigo_ref,
      ANY_VALUE(d.coeff_fb) AS coeff_fb,
      ANY_VALUE(d.coeff_nfb) AS coeff_nfb
    FROM v_hotel_params AS p
    INNER JOIN t_pilot_defaults AS d
      ON d.solution = p.solution
    GROUP BY p.solution

# Reference pour l hotel de v_loo_step : pairs uniquement, sinon fallback pilote.
v_solution_reference_loo:
  type: view
  mode: create_or_replace
  requires:
    - v_hotel_params
    - t_pilot_defaults
  sql: |-
    -- Pairs meme solution hors hotel evalue ; si solution mono-hotel
    -- (eval_biased / n_solution_hotels <= 1) on garde l'hotel (ref biaisee).
    WITH peers AS (
      SELECT p.*
      FROM v_hotel_params AS p
      CROSS JOIN v_loo_step AS step
      WHERE UPPER(TRIM(CAST(p.solution AS VARCHAR)))
          = UPPER(TRIM(CAST(step.solution AS VARCHAR)))
        AND (
          COALESCE(step.eval_biased, FALSE)
          OR COALESCE(step.n_solution_hotels, 0) <= 1
          OR p.hotel_code <> step.hotel_code
        )
    ),
    agg AS (
      SELECT
        step.hotel_code AS loo_hotel_code,
        step.solution,
        AVG(peers.ca_fb_mensuel) AS ca_fb_peers,
        AVG(peers.ca_nf_mensuel) AS ca_nfb_peers,
        AVG(peers.nb_ventes_mensuel) AS ventes_peers,
        AVG(peers.clients_mois) AS clients_peers,
        AVG(peers.mix_fb) AS mix_fb_peers,
        AVG(peers.m_lin) AS m_lin_peers,
        COUNT(DISTINCT peers.hotel_code) AS nombre_peers
      FROM v_loo_step AS step
      LEFT JOIN peers
        ON UPPER(TRIM(CAST(peers.solution AS VARCHAR)))
          = UPPER(TRIM(CAST(step.solution AS VARCHAR)))
      GROUP BY step.hotel_code, step.solution
    )
    SELECT
      a.loo_hotel_code,
      a.solution,
      a.nombre_peers,
      -- Reference operationnelle = moyenne pairs (sinon fallback pilote Excel)
      COALESCE(a.ca_fb_peers, d.ca_fb) AS ca_fb_ref,
      COALESCE(a.ca_nfb_peers, d.ca_nfb) AS ca_nfb_ref,
      COALESCE(a.ventes_peers, d.ventes) AS ventes_ref,
      COALESCE(a.clients_peers, d.clients_heb) AS clients_ref,
      COALESCE(a.mix_fb_peers, d.mix_fb) AS mix_fb_ref,
      CASE
        WHEN COALESCE(a.m_lin_peers, d.ml_ref) > 0
        THEN COALESCE(a.m_lin_peers, d.ml_ref)
        ELSE 6.0
      END AS ml_ref,
      d.frigo_ref,
      -- ca_10 Excel : (CA * 10%) / mix_ref   (E51 = (E34*10%)/I9)
      -- si CA pair = 0, fallback pivots Excel d.ca_10_*
      CASE
        WHEN COALESCE(a.ca_fb_peers, d.ca_fb) IS NULL
          OR COALESCE(a.ca_fb_peers, d.ca_fb) = 0
        THEN d.ca_10_fb
        WHEN COALESCE(a.mix_fb_peers, d.mix_fb) > 0
        THEN COALESCE(a.ca_fb_peers, d.ca_fb)
          * 0.1
          / COALESCE(a.mix_fb_peers, d.mix_fb)
        ELSE d.ca_10_fb
      END AS ca_10_fb,
      CASE
        WHEN COALESCE(a.ca_nfb_peers, d.ca_nfb) IS NULL
          OR COALESCE(a.ca_nfb_peers, d.ca_nfb) = 0
        THEN d.ca_10_nfb
        WHEN (1.0 - COALESCE(a.mix_fb_peers, d.mix_fb)) > 0
        THEN COALESCE(a.ca_nfb_peers, d.ca_nfb)
          * 0.1
          / (1.0 - COALESCE(a.mix_fb_peers, d.mix_fb))
        ELSE d.ca_10_nfb
      END AS ca_10_nfb,
      -- ca par ml : 0 si CA pair nul (comme Python ca_nf / ml_ref)
      COALESCE(a.ca_fb_peers, d.ca_fb)
        / NULLIF(
            CASE
              WHEN COALESCE(a.m_lin_peers, d.ml_ref) > 0
              THEN COALESCE(a.m_lin_peers, d.ml_ref)
              ELSE 6.0
            END,
            0
          ) AS ca_1ml_fb,
      COALESCE(a.ca_nfb_peers, d.ca_nfb)
        / NULLIF(
            CASE
              WHEN COALESCE(a.m_lin_peers, d.ml_ref) > 0
              THEN COALESCE(a.m_lin_peers, d.ml_ref)
              ELSE 6.0
            END,
            0
          ) AS ca_1ml_nfb,
      -- frigos Connected : CA / 3 (meme si CA pair = 0 → 0)
      COALESCE(a.ca_fb_peers, d.ca_fb) / 3.0 AS ca_1frigo_fb,
      COALESCE(a.ca_nfb_peers, d.ca_nfb) / 3.0 AS ca_1frigo_nfb,
      d.coeff_fb,
      d.coeff_nfb
    FROM agg AS a
    INNER JOIN t_pilot_defaults AS d
      ON d.solution = a.solution
