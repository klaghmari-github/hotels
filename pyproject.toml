[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rod-ia"
version = "0.1.0"
description = "Simulateur ROD Accor — règles Excel, feature store, prédiction IA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pandas>=2.0",
    "numpy>=1.24,<2.0",
    "openpyxl>=3.1.5",
    "requests>=2.31",
    "joblib>=1.3",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pyarrow>=14.0",
    "meteostat>=1.6",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["rod_ia*"]