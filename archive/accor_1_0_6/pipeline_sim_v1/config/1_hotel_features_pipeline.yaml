# Stage 1 — Vue unifiee des parametres hotel (deja prepares en stage 0)

v_hotel_params:
  type: view
  mode: create_or_replace
  requires:
    - t_hotel_params
  sql: |-
    SELECT
      hotel_code,
      solution,
      label,
      hotel_name,
      hotel_brand,
      nb_chambres,
      taux_occupation,
      guests_per_chambre,
      m_lin,
      nb_frigos_froid,
      clients_mois,
      mix_fb,
      ca_reel_mensuel,
      ca_fb_mensuel,
      ca_nf_mensuel,
      marge_reelle_mensuelle,
      nb_ventes_mensuel,
      nb_paniers_mensuel,
      n_mois
    FROM t_hotel_params
