<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROD Simulateur IA</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>ROD Simulateur IA</h1>
      <p>Simulation ROD Excel + prédiction IA + optimisation sous contraintes.</p>
    </header>

    <section class="card">
      <h2>Identification hôtel</h2>
      <div class="grid">
        <label>Nom hôtel<input id="hotel_name" value="Ibis budget Nice"></label>
        <label>Adresse<input id="address" value=""></label>
        <label>Ville<input id="city" value="Nice"></label>
        <label>Marque
          <select id="brand">
            <option>IBIS_BUDGET</option><option>IBIS_STYLES</option><option>MERCURE</option><option>NOVOTEL</option><option>AUTRE</option>
          </select>
        </label>
      </div>
      <button id="btn_enrich">Enrichir automatiquement POI + météo</button>
      <span id="enrich_status" class="status"></span>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="0">1. Infos générales</button>
      <button class="tab" data-tab="1">2. Configuration store</button>
      <button class="tab" data-tab="2">3. Contraintes</button>
      <button class="tab" data-tab="3">4. Résultats</button>
    </nav>

    <section class="panel active" data-panel="0">
      <div class="card grid">
        <label>Nombre de chambres<input id="nb_chambres" type="number" value="129"></label>
        <label>TO annuel<input id="taux_occupation" type="number" step="0.01" value="0.80"></label>
        <label>Guests / chambre<input id="guests_per_chambre" type="number" step="0.1" value="1.7"></label>
      </div>
    </section>

    <section class="panel" data-panel="1">
      <div class="card grid">
        <label>Concept
          <select id="concept"><option>SIMPLY</option><option>LIBERTY</option><option>CONNECTED</option></select>
        </label>
        <label>Mètres linéaires<input id="m_lin" type="number" step="0.1" value="2"></label>
        <label>Part F&B<input id="fb_share" type="number" step="0.01" value="0.70"></label>
        <label>Part Non-F&B<input id="non_fb_share" type="number" step="0.01" value="0.30"></label>
      </div>
    </section>

    <section class="panel" data-panel="2">
      <div class="card">
        <h2>Catégories exclues</h2>
        <label><input type="checkbox" class="excluded" value="ALCOOL"> Exclure alcool</label>
        <label><input type="checkbox" class="excluded" value="PAP"> Exclure prêt-à-porter</label>
        <label><input type="checkbox" class="excluded" value="SOUVENIRS"> Exclure souvenirs</label>
        <h2>Champs figés</h2>
        <label><input type="checkbox" class="locked" value="concept"> Concept figé</label>
        <label><input type="checkbox" class="locked" value="m_lin"> Mètres linéaires figés</label>
        <label><input type="checkbox" class="locked" value="fb_share"> Mix F&B figé</label>
      </div>
    </section>

    <section class="panel" data-panel="3">
      <div class="results">
        <div class="kpi"><span>CA ROD annuel</span><strong id="rod_ca">0 €</strong></div>
        <div class="kpi"><span>Marge ROD</span><strong id="rod_margin">0 €</strong></div>
        <div class="kpi"><span>CA IA annuel</span><strong id="ai_ca">0 €</strong></div>
      </div>
      <div class="card"><canvas id="monthly_chart"></canvas></div>
      <div class="card"><pre id="raw_output"></pre></div>
    </section>

    <div class="actions">
      <button id="btn_simulate">Simuler</button>
      <button id="btn_optimize">Optimiser sous contraintes</button>
    </div>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
