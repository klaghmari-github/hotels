<!DOCTYPE html>
<!--
  Accord Data Studio — page unique
  Structure :
    aside.sidebar  → navigation onglets (brand / hotel / weather / sales / holidays)
    main           → barre d'actions, table WYSIWYG paginée, pager
  Données chargées via /api/datasets/* (voir static/js/app.js).
-->
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accord · Data Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-text">
          <span class="brand-name">Accord</span>
          <span class="brand-sub">Data Studio</span>
        </div>
      </div>
      <nav class="nav-tabs" id="nav-tabs" aria-label="Jeux de données"></nav>
      <div class="sidebar-footer">
        <p class="hint">Colonnes saisissables uniquement · Enregistrement Excel direct</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="panel-title">Chargement…</h1>
          <p id="panel-desc" class="subtitle"></p>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input type="search" id="search-input" placeholder="Filtrer…" autocomplete="off" />
          </div>
          <button type="button" class="btn btn-ghost" id="btn-reload" title="Recharger depuis Excel">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M8 16H3v5"/></svg>
            Recharger
          </button>
          <button type="button" class="btn btn-ghost hidden" id="btn-rebuild" title="Recalculer All Data (fill météo + proximité via lat/lon)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M20 9A8 8 0 0 0 7 6L4 10"/><path d="M4 15a8 8 0 0 0 13 3l3-4"/></svg>
            Rebuild All Data
          </button>
          <button type="button" class="btn btn-ghost" id="btn-add">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Ligne
          </button>
          <button type="button" class="btn btn-primary" id="btn-save" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
            Enregistrer
          </button>
        </div>
      </header>

      <section class="meta-bar">
        <span class="chip" id="chip-file"></span>
        <span class="chip chip-muted" id="chip-stats"></span>
        <span class="chip chip-warn hidden" id="chip-dirty">Modifications non enregistrées</span>
        <span class="status" id="status-msg"></span>
      </section>

      <section class="table-panel">
        <div class="table-scroll" id="table-scroll">
          <table class="data-table" id="data-table">
            <thead id="table-head"></thead>
            <tbody id="table-body">
              <tr><td class="empty-state">Chargement des données…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <footer class="pager">
        <div class="pager-left">
          <label class="pager-size">
            Lignes / page
            <select id="page-size">
              <option value="15">15</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>
        <div class="pager-center">
          <button type="button" class="btn btn-icon" id="btn-first" title="Première">«</button>
          <button type="button" class="btn btn-icon" id="btn-prev" title="Précédente">‹</button>
          <span class="pager-info" id="pager-info">—</span>
          <button type="button" class="btn btn-icon" id="btn-next" title="Suivante">›</button>
          <button type="button" class="btn btn-icon" id="btn-last" title="Dernière">»</button>
        </div>
        <div class="pager-right">
          <button type="button" class="btn btn-danger-ghost" id="btn-delete" disabled>
            Supprimer sélection
          </button>
        </div>
      </footer>
    </main>
  </div>

  <div class="toast-host" id="toast-host"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
