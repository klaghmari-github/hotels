[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accor"
version = "1.0.0"
description = "Accor ROD — Data & Model Studio (admin) + simulateur directeur (user)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Accor ROD" }]
dependencies = [
  "flask>=3.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "numpy>=1.24",
  "requests>=2.31",
  "meteostat>=1.6",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
accor-admin = "accor.app:main"
accor-user = "accor.user.app:main"
accor-dev = "accor.dev_app:main"
accor-validate-rod = "accor.user.validate_rod:main"
accor-init-models = "accor.init_solution_models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accor = ["py.typed"]
