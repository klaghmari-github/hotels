v_sales_removed_hotel:
  type: view
  mode: create_or_replace
  requires:
  - v_sales_removed
  - v_sales_hotel_baseline
  script: "SELECT\n  h.hotel_code,\n  COALESCE(SUM(r.QUANTITE), 0) AS nombre_ventes_retirees,\n\
    \  MAX(h.nombre_ventes) / NULLIF(MAX(h.nombre_guests), 0) AS taux_conversion\n\
    FROM v_sales_hotel_baseline AS h\nLEFT JOIN v_sales_removed AS r ON r.HOTEL_CODE\
    \ = h.hotel_code\nGROUP BY h.hotel_code\n"
