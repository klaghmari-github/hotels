t_rank_nature:
  type: table
  mode: create_if_not_exists
  requires:
  - t_sales
  script: "WITH t_nature_marge AS (\n    SELECT HOTEL_CODE AS hotel_code, NATURE_PRODUIT\
    \ AS nature, SUM(MARGE) AS montant_marge\n    FROM t_sales\n    WHERE NATURE_PRODUIT\
    \ IS NOT NULL\n    GROUP BY HOTEL_CODE, NATURE_PRODUIT\n)\nSELECT hotel_code,\
    \ nature, montant_marge,\n       ROW_NUMBER() OVER (PARTITION BY hotel_code ORDER\
    \ BY montant_marge, nature) AS rang_nature\nFROM t_nature_marge\nORDER BY hotel_code,\
    \ rang_nature"
  name: t_rank_nature
