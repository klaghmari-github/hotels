v_dataset_mix_pourcentage:
  type: view
  mode: create_or_replace
  requires:
  - v_dataset_mix_nombre_global
  - t_dataset_mix_pourcentage_detail
  script: 'SELECT g.hotel_code, g.nombre_natures, d.* EXCLUDE (hotel_code)

    FROM v_dataset_mix_nombre_global AS g

    LEFT JOIN t_dataset_mix_pourcentage_detail AS d USING (hotel_code)

    '
  name: v_dataset_mix_pourcentage
