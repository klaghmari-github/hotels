v_dataset_observation_activity:
  type: view
  mode: create_or_replace
  requires:
  - v_sales_current
  script: "SELECT\n  HOTEL_CODE AS hotel_code,\n  SUM(QUANTITE) AS nombre_ventes,\n\
    \  SUM(PRIX_TTC) AS montant_ventes,\n  SUM(MARGE_SELON_COEF) AS montant_marge_selon_coef,\n\
    \  SUM(MARGE) AS montant_marge\nFROM v_sales_current\nGROUP BY HOTEL_CODE"
