t_rank_type:
  type: table
  mode: create_if_not_exists
  requires:
  - t_rank_nature_by_type
  script: "WITH t_group AS (\n    SELECT hotel_code, type, SUM(montant_marge) AS montant_marge,\n\
    \           COUNT(*) AS nombre_natures,\n           LIST(nature ORDER BY rang_nature)\
    \ AS natures\n    FROM t_rank_nature_by_type\n    GROUP BY hotel_code, type\n\
    )\nSELECT hotel_code, type, montant_marge, nombre_natures, natures,\n       ROW_NUMBER()\
    \ OVER (PARTITION BY hotel_code ORDER BY montant_marge, type) AS rang_type\nFROM\
    \ t_group\nORDER BY hotel_code, rang_type"
  name: t_rank_type
