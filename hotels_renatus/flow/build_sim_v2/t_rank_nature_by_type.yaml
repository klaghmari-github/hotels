t_rank_nature_by_type:
  type: table
  mode: create_if_not_exists
  requires:
  - t_sales
  script: "WITH t_nature_marge AS (\n    SELECT HOTEL_CODE AS hotel_code, TYPE AS\
    \ type, NATURE_PRODUIT AS nature, SUM(MARGE) AS montant_marge\n    FROM t_sales\n\
    \    WHERE TYPE IS NOT NULL AND NATURE_PRODUIT IS NOT NULL\n    GROUP BY HOTEL_CODE,\
    \ TYPE, NATURE_PRODUIT\n)\nSELECT hotel_code, type, nature, montant_marge,\n \
    \      ROW_NUMBER() OVER (PARTITION BY hotel_code, type ORDER BY montant_marge,\
    \ nature) AS rang_nature\nFROM t_nature_marge\nORDER BY hotel_code, type, rang_nature"
  name: t_rank_nature_by_type
