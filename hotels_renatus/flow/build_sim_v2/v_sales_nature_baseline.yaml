v_sales_nature_baseline:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  - v_sales_hotel_baseline
  script: "SELECT\n  s.HOTEL_CODE AS hotel_code,\n  s.NATURE_PRODUIT AS nature,\n\
    \  SUM(s.QUANTITE) AS nature_nombre_ventes,\n  SUM(s.QUANTITE) / NULLIF(MAX(h.nombre_ventes),\
    \ 0) AS nature_part_nombre_ventes\nFROM t_sales AS s\nINNER JOIN v_sales_hotel_baseline\
    \ AS h ON h.hotel_code = s.HOTEL_CODE\nWHERE s.NATURE_PRODUIT IS NOT NULL\nGROUP\
    \ BY s.HOTEL_CODE, s.NATURE_PRODUIT\n"
  name: v_sales_nature_baseline
