t_rank_nature_by_gamme:
  type: table
  mode: create_if_not_exists
  requires:
  - t_sales
  script: "WITH t_nature_marge AS (\n    SELECT HOTEL_CODE AS hotel_code, GAMME AS\
    \ gamme, NATURE_PRODUIT AS nature, SUM(MARGE) AS montant_marge\n    FROM t_sales\n\
    \    WHERE GAMME IS NOT NULL AND NATURE_PRODUIT IS NOT NULL\n    GROUP BY HOTEL_CODE,\
    \ GAMME, NATURE_PRODUIT\n)\nSELECT hotel_code, gamme, nature, montant_marge,\n\
    \       ROW_NUMBER() OVER (PARTITION BY hotel_code, gamme ORDER BY montant_marge,\
    \ nature) AS rang_nature\nFROM t_nature_marge\nORDER BY hotel_code, gamme, rang_nature"
  name: t_rank_nature_by_gamme
