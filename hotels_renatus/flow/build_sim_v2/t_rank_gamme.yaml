t_rank_gamme:
  type: table
  mode: create_if_not_exists
  requires:
  - t_rank_nature_by_gamme
  script: "WITH t_group AS (\n    SELECT hotel_code, gamme, SUM(montant_marge) AS\
    \ montant_marge,\n           COUNT(*) AS nombre_natures,\n           LIST(nature\
    \ ORDER BY rang_nature) AS natures\n    FROM t_rank_nature_by_gamme\n    GROUP\
    \ BY hotel_code, gamme\n)\nSELECT hotel_code, gamme, montant_marge, nombre_natures,\
    \ natures,\n       ROW_NUMBER() OVER (PARTITION BY hotel_code ORDER BY montant_marge,\
    \ gamme) AS rang_gamme\nFROM t_group\nORDER BY hotel_code, rang_gamme"
