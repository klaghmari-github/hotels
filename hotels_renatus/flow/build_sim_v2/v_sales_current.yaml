v_sales_current:
  type: view
  mode: create_or_replace
  label: sales_current (redistrib)
  requires:
  - v_sales_filtered
  - v_sales_nature_baseline
  - v_sales_removed_hotel
  script: "-- Volume retiré réinjecté sur natures conservées (prorata parmi restantes).\n\
    -- Aligné release_1_0_0 pipeline/sim_v2/4_simulation_pipeline.yaml\nWITH remaining_totals\
    \ AS (\n  SELECT\n    f.HOTEL_CODE AS hotel_code,\n    SUM(nb.nature_nombre_ventes)\
    \ AS remaining_nombre_ventes\n  FROM (\n    SELECT DISTINCT HOTEL_CODE, NATURE_PRODUIT\n\
    \    FROM v_sales_filtered\n  ) AS f\n  INNER JOIN v_sales_nature_baseline AS\
    \ nb\n    ON nb.hotel_code = f.HOTEL_CODE AND nb.nature = f.NATURE_PRODUIT\n \
    \ GROUP BY f.HOTEL_CODE\n), sales_factor AS (\n  SELECT\n    f.*,\n    rh.nombre_ventes_retirees\n\
    \      * (nb.nature_nombre_ventes / NULLIF(rt.remaining_nombre_ventes, 0))\n \
    \     AS nature_nombre_ventes_ajoutees,\n    f.QUANTITE / NULLIF(nb.nature_nombre_ventes,\
    \ 0) AS ligne_part_nature\n  FROM v_sales_filtered AS f\n  INNER JOIN v_sales_nature_baseline\
    \ AS nb\n    ON nb.hotel_code = f.HOTEL_CODE AND nb.nature = f.NATURE_PRODUIT\n\
    \  INNER JOIN v_sales_removed_hotel AS rh ON rh.hotel_code = f.HOTEL_CODE\n  INNER\
    \ JOIN remaining_totals AS rt ON rt.hotel_code = f.HOTEL_CODE\n), sales_quantite\
    \ AS (\n  SELECT *, QUANTITE + nature_nombre_ventes_ajoutees * ligne_part_nature\
    \ AS quantite_scenario\n  FROM sales_factor\n)\nSELECT\n  * EXCLUDE (\n    QUANTITE,\
    \ PRIX_HT, PRIX_TTC, PRIX_TTC_MARCHE, MARGE_SELON_COEF, MARGE,\n    nature_nombre_ventes_ajoutees,\
    \ ligne_part_nature, quantite_scenario\n  ),\n  quantite_scenario AS QUANTITE,\n\
    \  PRIX_HT * quantite_scenario / NULLIF(QUANTITE, 0) AS PRIX_HT,\n  PRIX_TTC *\
    \ quantite_scenario / NULLIF(QUANTITE, 0) AS PRIX_TTC,\n  PRIX_TTC_MARCHE * quantite_scenario\
    \ / NULLIF(QUANTITE, 0) AS PRIX_TTC_MARCHE,\n  MARGE_SELON_COEF * quantite_scenario\
    \ / NULLIF(QUANTITE, 0) AS MARGE_SELON_COEF,\n  MARGE * quantite_scenario / NULLIF(QUANTITE,\
    \ 0) AS MARGE\nFROM sales_quantite\n"
  name: v_sales_current
