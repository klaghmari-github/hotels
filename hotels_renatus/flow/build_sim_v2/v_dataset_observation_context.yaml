v_dataset_observation_context:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  script: "SELECT\n  HOTEL_CODE AS hotel_code,\n  DATE_DIFF('month', MIN(DATE), MAX(DATE))\
    \ + 1 AS nombre_mois,\n  MAX(HOTEL_NB_CHAMBRES) AS hotel_nb_chambres,\n  MAX(HOTEL_TO_ANNUEL)\
    \ AS hotel_to_annuel,\n  MAX(HOTEL_GUESTS_PER_CHAMBRE) AS hotel_guests_per_chambre,\n\
    \  MAX(HOTEL_NB_CHAMBRES) * MAX(HOTEL_TO_ANNUEL) * MAX(HOTEL_GUESTS_PER_CHAMBRE)\
    \ * 30.5 AS nombre_guests_par_mois,\n  MAX(HOTEL_NB_CHAMBRES) * MAX(HOTEL_TO_ANNUEL)\
    \ * MAX(HOTEL_GUESTS_PER_CHAMBRE) * 30.5\n    * (DATE_DIFF('month', MIN(DATE),\
    \ MAX(DATE)) + 1) AS nombre_guests\nFROM t_sales\nGROUP BY HOTEL_CODE\n"
