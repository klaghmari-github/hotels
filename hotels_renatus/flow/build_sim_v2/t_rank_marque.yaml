t_rank_marque:
  type: table
  mode: create_if_not_exists
  requires:
  - t_rank_nature_by_marque
  script: "WITH t_group AS (\n    SELECT hotel_code, marque, SUM(montant_marge) AS\
    \ montant_marge,\n           COUNT(*) AS nombre_natures,\n           LIST(nature\
    \ ORDER BY rang_nature) AS natures\n    FROM t_rank_nature_by_marque\n    GROUP\
    \ BY hotel_code, marque\n)\nSELECT hotel_code, marque, montant_marge, nombre_natures,\
    \ natures,\n       ROW_NUMBER() OVER (PARTITION BY hotel_code ORDER BY montant_marge,\
    \ marque) AS rang_marque\nFROM t_group\nORDER BY hotel_code, rang_marque"
