v_estimate_ml_features:
  type: view
  mode: create_or_replace
  label: estimate_ml_features
  requires:
  - t_estimate_input_ml
  script: "-- Leviers d'entrée ML (contexte hôtel optionnel hors build_ml)\nSELECT\n\
    \  CAST(hotel_code AS VARCHAR) AS hotel_code,\n  LOWER(TRIM(CAST(solution AS VARCHAR)))\
    \ AS solution,\n  TRY_CAST(hotel_nb_chambres AS DOUBLE) AS hotel_nb_chambres,\n\
    \  TRY_CAST(hotel_to_annuel AS DOUBLE) AS hotel_to_annuel,\n  TRY_CAST(hotel_guests_per_chambre\
    \ AS DOUBLE) AS hotel_guests_per_chambre,\n  TRY_CAST(metres_lineaires AS DOUBLE)\
    \ AS metres_lineaires,\n  TRY_CAST(hotel_nb_chambres AS DOUBLE)\n    * TRY_CAST(hotel_to_annuel\
    \ AS DOUBLE)\n    * TRY_CAST(hotel_guests_per_chambre AS DOUBLE)\n    * 30.5 AS\
    \ nombre_guests_par_mois\nFROM t_estimate_input_ml\n"
  name: v_estimate_ml_features
