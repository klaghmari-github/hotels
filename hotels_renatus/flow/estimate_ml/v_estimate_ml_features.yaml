v_estimate_ml_features:
  type: view
  mode: create_or_replace
  label: estimate_ml_features
  requires:
  - df_estimate_input_ml
  - v_ml_hotel_context
  script: "-- Feature row for inference; model score needs execute_python later.\n\
    SELECT\n  i.*,\n  c.hotel_nb_chambres AS ctx_nb_chambres,\n  c.hotel_to_annuel\
    \ AS ctx_to,\n  c.hotel_guests_per_chambre AS ctx_guests\nFROM df_estimate_input_ml\
    \ AS i\nLEFT JOIN v_ml_hotel_context AS c\n  ON CAST(c.hotel_code AS VARCHAR)\
    \ = CAST(i.hotel_code AS VARCHAR)\n"
