v_estimate_input_hotel:
  type: view
  mode: create_or_replace
  label: estimate_input_hotel_v2
  requires:
  - t_estimate_input_v2
  script: "SELECT\n  TRY_CAST(hotel_nb_chambres AS DOUBLE) AS hotel_nb_chambres,\n\
    \  TRY_CAST(hotel_to_annuel AS DOUBLE) AS hotel_to_annuel,\n  TRY_CAST(hotel_guests_per_chambre\
    \ AS DOUBLE) AS hotel_guests_per_chambre,\n  TRY_CAST(metres_lineaires AS DOUBLE)\
    \ AS metres_lineaires,\n  TRY_CAST(hotel_nb_chambres AS DOUBLE)\n    * TRY_CAST(hotel_to_annuel\
    \ AS DOUBLE)\n    * TRY_CAST(hotel_guests_per_chambre AS DOUBLE)\n    * 30.5 AS\
    \ nombre_guests_par_mois,\n  CAST(hotel_code AS VARCHAR) AS hotel_code,\n  LOWER(TRIM(CAST(solution\
    \ AS VARCHAR))) AS solution\nFROM t_estimate_input_v2\n"
  name: v_estimate_input_hotel
