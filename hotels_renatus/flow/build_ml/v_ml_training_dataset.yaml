v_ml_training_dataset:
  type: view
  mode: create_or_replace
  requires:
  - t_dataset_pivot
  - v_ml_hotel_context
  script: "SELECT\n  p.scenario_id,\n  p.hotel_code,\n  p.solution,\n  COALESCE(LEN(p.scenario_removed_natures),\
    \ 0) = 0 AS is_observation,\n  h.hotel_nb_chambres,\n  h.hotel_to_annuel,\n  h.hotel_guests_per_chambre,\n\
    \  p.metres_lineaires,\n  COLUMNS('^(type|gamme)_.*_part_natures$'),\n  p.montant_ventes_par_mois,\n\
    \  p.montant_marge_par_mois,\n  p.montant_marge_selon_coef_par_mois\nFROM t_dataset_pivot\
    \ AS p\nINNER JOIN v_ml_hotel_context AS h\n  USING (hotel_code)\n"
  name: v_ml_training_dataset
