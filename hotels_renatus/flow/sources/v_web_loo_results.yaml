v_web_loo_results:
  type: view
  mode: create_or_replace
  requires:
  - t_loo_results
  script: "SELECT\n  hotel_code,\n  solution,\n  methode,\n  montant_ventes_par_mois_reel\
    \ AS ca_reel,\n  montant_ventes_par_mois_predit AS ca_pred,\n  montant_ventes_erreur_absolue\
    \ AS ca_err_abs,\n  montant_marge_selon_coef_par_mois_reel AS marge_reel,\n  montant_marge_selon_coef_par_mois_predite\
    \ AS marge_pred,\n  montant_marge_selon_coef_erreur_absolue AS marge_err_abs\n\
    FROM t_loo_results\nWHERE hotel_code IS NOT NULL\nORDER BY solution, hotel_code"
