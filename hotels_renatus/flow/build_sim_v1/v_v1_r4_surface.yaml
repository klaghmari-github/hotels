v_v1_r4_surface:
  type: view
  mode: create_or_replace
  requires:
  - v_v1_r3_categories
  script: "SELECT\n  r3.*,\n  CASE\n    WHEN r3.solution = 'CONNECTED' AND r3.frigo_ref\
    \ IS NOT NULL\n    THEN r3.nb_frigos_froid - r3.frigo_ref\n    ELSE r3.m_lin_hotel\
    \ - r3.ml_ref\n  END AS r4_diff,\n  CASE\n    WHEN r3.solution = 'CONNECTED' AND\
    \ r3.frigo_ref IS NOT NULL\n    THEN 'frigos_froid'\n    ELSE 'm_lin'\n  END AS\
    \ r4_mode,\n  CASE\n    WHEN r3.solution = 'CONNECTED' AND r3.frigo_ref IS NOT\
    \ NULL\n    THEN r3.ca_fb_r3\n      + SIGN(r3.nb_frigos_froid - r3.frigo_ref)\n\
    \        * r3.ca_1frigo_fb\n        * ABS(r3.nb_frigos_froid - r3.frigo_ref)\n\
    \    ELSE r3.ca_fb_r3\n      + SIGN(r3.m_lin_hotel - r3.ml_ref)\n        * r3.ca_1ml_fb\n\
    \        * ABS(r3.m_lin_hotel - r3.ml_ref)\n  END AS ca_fb_r4,\n  CASE\n    WHEN\
    \ r3.solution = 'CONNECTED' AND r3.frigo_ref IS NOT NULL\n    THEN r3.ca_nfb_r3\n\
    \      + SIGN(r3.nb_frigos_froid - r3.frigo_ref)\n        * r3.ca_1frigo_nfb\n\
    \        * ABS(r3.nb_frigos_froid - r3.frigo_ref)\n    ELSE r3.ca_nfb_r3\n   \
    \   + SIGN(r3.m_lin_hotel - r3.ml_ref)\n        * r3.ca_1ml_nfb\n        * ABS(r3.m_lin_hotel\
    \ - r3.ml_ref)\n  END AS ca_nfb_r4\nFROM v_v1_r3_categories AS r3"
