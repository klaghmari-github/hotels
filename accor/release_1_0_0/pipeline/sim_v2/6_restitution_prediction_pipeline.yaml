v_restitution_input_hotel:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_default_input_hotel
  sql: SELECT * FROM v_restitution_default_input_hotel
v_restitution_input_mix:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_default_input_mix
  sql: SELECT * FROM v_restitution_default_input_mix
v_restitution_prediction_by_variable:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_solution_coefficients
  - v_restitution_input_hotel
  - v_restitution_input_mix
  sql: |-
    WITH hotel AS (
      SELECT *,
        hotel_nb_chambres * hotel_to_annuel * hotel_guests_per_chambre * 30.5
          AS nombre_guests_par_mois
      FROM v_restitution_input_hotel
    )
    SELECT
      c.solution,
      c.variable_family,
      c.variable_name,
      m.target_part,
      h.nombre_guests_par_mois,
      h.metres_lineaires,
      c.montant_ventes_coefficient
        * h.nombre_guests_par_mois * h.metres_lineaires * m.target_part
          AS montant_ventes_par_mois_predit,
      c.montant_marge_selon_coef_coefficient
        * h.nombre_guests_par_mois * h.metres_lineaires * m.target_part
          AS montant_marge_selon_coef_par_mois_predite,
      c.montant_marge_coefficient
        * h.nombre_guests_par_mois * h.metres_lineaires * m.target_part
          AS montant_marge_par_mois_predite,
      c.nombre_observations,
      c.nombre_hotels
    FROM v_restitution_solution_coefficients AS c
    INNER JOIN v_restitution_input_mix AS m
      USING (variable_family, variable_name)
    CROSS JOIN hotel AS h
    WHERE m.target_part > 0
v_restitution_prediction_method_a:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_prediction_by_variable
  sql: |-
    SELECT
      solution,
      'A' AS methode,
      AVG(montant_ventes_par_mois_predit) AS montant_ventes_par_mois_predit,
      AVG(montant_marge_selon_coef_par_mois_predite) AS montant_marge_selon_coef_par_mois_predite,
      AVG(montant_marge_par_mois_predite) AS montant_marge_par_mois_predite,
      COUNT(*) AS nombre_predicteurs,
      COUNT(DISTINCT variable_family) AS nombre_familles
    FROM v_restitution_prediction_by_variable
    GROUP BY solution
v_restitution_prediction_method_b:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_prediction_by_variable
  sql: |-
    WITH family_prediction AS (
      SELECT
        solution,
        variable_family,
        AVG(montant_ventes_par_mois_predit) AS montant_ventes_par_mois_predit,
        AVG(montant_marge_selon_coef_par_mois_predite) AS montant_marge_selon_coef_par_mois_predite,
        AVG(montant_marge_par_mois_predite) AS montant_marge_par_mois_predite,
        COUNT(*) AS nombre_predicteurs
      FROM v_restitution_prediction_by_variable
      GROUP BY solution, variable_family
    )
    SELECT
      solution,
      'B' AS methode,
      AVG(montant_ventes_par_mois_predit) AS montant_ventes_par_mois_predit,
      AVG(montant_marge_selon_coef_par_mois_predite) AS montant_marge_selon_coef_par_mois_predite,
      AVG(montant_marge_par_mois_predite) AS montant_marge_par_mois_predite,
      SUM(nombre_predicteurs) AS nombre_predicteurs,
      COUNT(*) AS nombre_familles
    FROM family_prediction
    GROUP BY solution
v_restitution_prediction:
  type: view
  mode: create_or_replace
  requires:
  - v_restitution_prediction_method_a
  - v_restitution_prediction_method_b
  - v_solution_conversion_rate
  sql: |-
    SELECT p.*, c.taux_conversion_moyen, c.taux_conversion_pondere, c.nombre_hotels AS nombre_hotels_conversion
    FROM (
      SELECT * FROM v_restitution_prediction_method_a
      UNION ALL
      SELECT * FROM v_restitution_prediction_method_b
    ) AS p
    LEFT JOIN v_solution_conversion_rate AS c USING (solution)
    ORDER BY solution, methode
