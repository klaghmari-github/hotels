# Stage 4 — Iteration leave-one-out (style config/7_loo_pipeline.yaml)

t_v1_loo_hotels:
  type: table
  mode: create_or_replace
  requires:
    - t_scope_hotels
  sql: |-
    SELECT
      hotel_code,
      solution,
      label,
      name
    FROM t_scope_hotels
    WHERE hotel_code IN (
      'H2075', 'HB6A3', 'H6188', 'HB5I0', 'H0373', 'H3546'
    )
      AND hotel_code NOT IN ('H5586')
    ORDER BY solution, hotel_code

t_v1_loo_results:
  type: table
  mode: create_if_not_exists
  requires:
    - t_v1_loo_hotels
  sql: |-
    SELECT
      CAST(NULL AS VARCHAR) AS hotel_code,
      CAST(NULL AS VARCHAR) AS solution,
      CAST(NULL AS DOUBLE) AS clients_hotel,
      CAST(NULL AS DOUBLE) AS taux_acheteurs,
      CAST(NULL AS DOUBLE) AS nb_acheteurs,
      CAST(NULL AS DOUBLE) AS mix_steps,
      CAST(NULL AS DOUBLE) AS mult_fb,
      CAST(NULL AS DOUBLE) AS mult_nfb,
      CAST(NULL AS VARCHAR) AS r4_mode,
      CAST(NULL AS DOUBLE) AS r4_diff,
      CAST(NULL AS DOUBLE) AS ca_fb_r4,
      CAST(NULL AS DOUBLE) AS ca_nfb_r4,
      CAST(NULL AS DOUBLE) AS ca_ht_predit,
      CAST(NULL AS DOUBLE) AS marge_produit_predite,
      CAST(NULL AS DOUBLE) AS ca_reel_mensuel,
      CAST(NULL AS DOUBLE) AS marge_reelle_mensuelle,
      CAST(NULL AS DOUBLE) AS n_mois,
      CAST(NULL AS DOUBLE) AS erreur_ca,
      CAST(NULL AS DOUBLE) AS erreur_marge,
      CAST(NULL AS DOUBLE) AS abs_erreur_ca,
      CAST(NULL AS DOUBLE) AS abs_erreur_marge
    WHERE 1 = 0

v_v1_loo_result:
  type: view
  mode: create_or_replace
  requires:
    - v_v1_prediction
  sql: |-
    SELECT *
    FROM v_v1_prediction

x_insert_v1_loo_result:
  type: execute
  requires:
    - t_v1_loo_results
    - v_v1_loo_result
  sql: |-
    INSERT INTO t_v1_loo_results BY NAME
    SELECT r.*
    FROM v_v1_loo_result AS r
    WHERE NOT EXISTS (
      SELECT 1
      FROM t_v1_loo_results AS t
      WHERE t.hotel_code = r.hotel_code
    )

i_v1_loo_evaluation:
  type: iteration
  execution: sequential
  tasks: 1
  requires:
    - t_v1_loo_hotels
  scenarios: t_v1_loo_hotels
  step_view: v_loo_step
  target: x_insert_v1_loo_result
  order_by:
    - hotel_code

v_v1_loo_metrics:
  type: view
  mode: create_or_replace
  requires:
    - t_v1_loo_results
  sql: |-
    SELECT
      'ALL' AS perimetre,
      COUNT(*) AS n_hotels,
      AVG(abs_erreur_ca) AS mae_ca,
      AVG(abs_erreur_marge) AS mae_marge,
      AVG(
        CASE
          WHEN ca_reel_mensuel <> 0
          THEN 100.0 * abs_erreur_ca / ABS(ca_reel_mensuel)
          ELSE NULL
        END
      ) AS mape_ca_pct,
      AVG(
        CASE
          WHEN marge_reelle_mensuelle <> 0
          THEN 100.0 * abs_erreur_marge / ABS(marge_reelle_mensuelle)
          ELSE NULL
        END
      ) AS mape_marge_pct
    FROM t_v1_loo_results
    WHERE hotel_code IS NOT NULL

    UNION ALL

    SELECT
      solution AS perimetre,
      COUNT(*) AS n_hotels,
      AVG(abs_erreur_ca) AS mae_ca,
      AVG(abs_erreur_marge) AS mae_marge,
      AVG(
        CASE
          WHEN ca_reel_mensuel <> 0
          THEN 100.0 * abs_erreur_ca / ABS(ca_reel_mensuel)
          ELSE NULL
        END
      ) AS mape_ca_pct,
      AVG(
        CASE
          WHEN marge_reelle_mensuelle <> 0
          THEN 100.0 * abs_erreur_marge / ABS(marge_reelle_mensuelle)
          ELSE NULL
        END
      ) AS mape_marge_pct
    FROM t_v1_loo_results
    WHERE hotel_code IS NOT NULL
    GROUP BY solution
