# Stage 3 — Chaine R1 → R2 → R3 → R4 → marge produit

v_v1_hotel_input:
  type: view
  mode: create_or_replace
  requires:
    - v_hotel_params
  sql: |-
    SELECT h.*
    FROM v_hotel_params AS h
    CROSS JOIN v_loo_step AS step
    WHERE h.hotel_code = step.hotel_code

# R1 — clients acheteurs
v_v1_r1_buyers:
  type: view
  mode: create_or_replace
  requires:
    - v_v1_hotel_input
    - v_solution_reference_loo
  sql: |-
    SELECT
      h.hotel_code,
      h.solution,
      h.clients_mois AS clients_hotel,
      r.ventes_ref AS ventes_pilote,
      r.clients_ref AS clients_pilote,
      r.ca_fb_ref AS ca_fb_pilote,
      r.ca_nfb_ref AS ca_nfb_pilote,
      CASE
        WHEN r.clients_ref > 0 THEN r.ventes_ref / r.clients_ref
        ELSE 0.0
      END AS taux_acheteurs,
      CASE
        WHEN r.clients_ref > 0
        THEN h.clients_mois * (r.ventes_ref / r.clients_ref)
        ELSE 0.0
      END AS nb_acheteurs,
      CASE
        WHEN r.ventes_ref > 0 AND r.clients_ref > 0
        THEN (r.ca_fb_ref / r.ventes_ref)
          * (h.clients_mois * (r.ventes_ref / r.clients_ref))
        ELSE 0.0
      END AS ca_fb_r1,
      CASE
        WHEN r.ventes_ref > 0 AND r.clients_ref > 0
        THEN (r.ca_nfb_ref / r.ventes_ref)
          * (h.clients_mois * (r.ventes_ref / r.clients_ref))
        ELSE 0.0
      END AS ca_nfb_r1,
      r.mix_fb_ref,
      h.mix_fb AS mix_fb_hotel,
      h.m_lin AS m_lin_hotel,
      h.nb_frigos_froid,
      r.ml_ref,
      r.frigo_ref,
      r.ca_10_fb,
      r.ca_10_nfb,
      r.ca_1ml_fb,
      r.ca_1ml_nfb,
      r.ca_1frigo_fb,
      r.ca_1frigo_nfb,
      r.coeff_fb,
      r.coeff_nfb,
      h.ca_reel_mensuel,
      h.marge_reelle_mensuelle,
      h.n_mois
    FROM v_v1_hotel_input AS h
    INNER JOIN v_solution_reference_loo AS r
      ON r.loo_hotel_code = h.hotel_code
     AND r.solution = h.solution

# R2 — mix ±10 %
v_v1_r2_mix:
  type: view
  mode: create_or_replace
  requires:
    - v_v1_r1_buyers
  sql: |-
    SELECT
      r1.*,
      (COALESCE(r1.mix_fb_hotel, r1.mix_fb_ref) - r1.mix_fb_ref) * 10.0 AS mix_steps,
      r1.ca_fb_r1
        + r1.ca_10_fb
          * ((COALESCE(r1.mix_fb_hotel, r1.mix_fb_ref) - r1.mix_fb_ref) * 10.0)
        AS ca_fb_r2,
      r1.ca_nfb_r1
        + r1.ca_10_nfb
          * (-((COALESCE(r1.mix_fb_hotel, r1.mix_fb_ref) - r1.mix_fb_ref) * 10.0))
        AS ca_nfb_r2
    FROM v_v1_r1_buyers AS r1

# R3 — toutes categories ON (mult 1.48 / 1.33)
v_v1_r3_categories:
  type: view
  mode: create_or_replace
  requires:
    - v_v1_r2_mix
  sql: |-
    SELECT
      r2.*,
      1.48 AS mult_fb,
      1.33 AS mult_nfb,
      r2.ca_fb_r2 * 1.48 AS ca_fb_r3,
      r2.ca_nfb_r2 * 1.33 AS ca_nfb_r3
    FROM v_v1_r2_mix AS r2

# R4 — m_lin (S/L) ou frigos (Connected)
v_v1_r4_surface:
  type: view
  mode: create_or_replace
  requires:
    - v_v1_r3_categories
  sql: |-
    SELECT
      r3.*,
      CASE
        WHEN r3.solution = 'CONNECTED' AND r3.frigo_ref IS NOT NULL
        THEN r3.nb_frigos_froid - r3.frigo_ref
        ELSE r3.m_lin_hotel - r3.ml_ref
      END AS r4_diff,
      CASE
        WHEN r3.solution = 'CONNECTED' AND r3.frigo_ref IS NOT NULL
        THEN 'frigos_froid'
        ELSE 'm_lin'
      END AS r4_mode,
      CASE
        WHEN r3.solution = 'CONNECTED' AND r3.frigo_ref IS NOT NULL
        THEN r3.ca_fb_r3
          + SIGN(r3.nb_frigos_froid - r3.frigo_ref)
            * r3.ca_1frigo_fb
            * ABS(r3.nb_frigos_froid - r3.frigo_ref)
        ELSE r3.ca_fb_r3
          + SIGN(r3.m_lin_hotel - r3.ml_ref)
            * r3.ca_1ml_fb
            * ABS(r3.m_lin_hotel - r3.ml_ref)
      END AS ca_fb_r4,
      CASE
        WHEN r3.solution = 'CONNECTED' AND r3.frigo_ref IS NOT NULL
        THEN r3.ca_nfb_r3
          + SIGN(r3.nb_frigos_froid - r3.frigo_ref)
            * r3.ca_1frigo_nfb
            * ABS(r3.nb_frigos_froid - r3.frigo_ref)
        ELSE r3.ca_nfb_r3
          + SIGN(r3.m_lin_hotel - r3.ml_ref)
            * r3.ca_1ml_nfb
            * ABS(r3.m_lin_hotel - r3.ml_ref)
      END AS ca_nfb_r4
    FROM v_v1_r3_categories AS r3

v_v1_marge_produit:
  type: view
  mode: create_or_replace
  requires:
    - v_v1_r4_surface
  sql: |-
    SELECT
      r4.*,
      r4.ca_fb_r4 + r4.ca_nfb_r4 AS ca_ht_predit,
      CASE
        WHEN r4.coeff_fb > 0
        THEN r4.ca_fb_r4 - (r4.ca_fb_r4 / r4.coeff_fb)
        ELSE 0.0
      END
      + CASE
        WHEN r4.coeff_nfb > 0
        THEN r4.ca_nfb_r4 - (r4.ca_nfb_r4 / r4.coeff_nfb)
        ELSE 0.0
      END AS marge_produit_predite
    FROM v_v1_r4_surface AS r4

v_v1_prediction:
  type: view
  mode: create_or_replace
  requires:
    - v_v1_marge_produit
  sql: |-
    SELECT
      hotel_code,
      solution,
      clients_hotel,
      taux_acheteurs,
      nb_acheteurs,
      mix_steps,
      mult_fb,
      mult_nfb,
      r4_mode,
      r4_diff,
      ca_fb_r4,
      ca_nfb_r4,
      ca_ht_predit,
      marge_produit_predite,
      ca_reel_mensuel,
      marge_reelle_mensuelle,
      n_mois,
      ca_ht_predit - ca_reel_mensuel AS erreur_ca,
      marge_produit_predite - marge_reelle_mensuelle AS erreur_marge,
      ABS(ca_ht_predit - ca_reel_mensuel) AS abs_erreur_ca,
      ABS(marge_produit_predite - marge_reelle_mensuelle) AS abs_erreur_marge
    FROM v_v1_marge_produit
