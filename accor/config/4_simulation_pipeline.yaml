df_scenarios:
  type: dataframe
  requires: []
  file: data/scenarios.xlsx
t_scenarios:
  type: table
  mode: create_if_not_exists
  requires:
  - df_scenarios
  sql: |
    SELECT
        CAST(scenario_id AS INTEGER) AS scenario_id,
        FROM_JSON(
            scenario_removed_natures_json,
            '["VARCHAR"]'
        ) AS scenario_removed_natures
    FROM
        df_scenarios
    ORDER BY
        scenario_id
v_scenario_step:
  type: view
  mode: create_if_not_exists
  requires:
    - t_scenarios
  sql: |
    SELECT
        scenario_id,
        scenario_removed_natures
    FROM
        t_scenarios
    WHERE
        scenario_id = 0
v_scenario_removed_natures:
  type: view
  mode: create_or_replace
  requires: 
    - v_scenario_step
  sql: |
    SELECT
        scenario_id,
        UNNEST(scenario_removed_natures) AS nature
    FROM
        v_scenario_step
v_sales_hotel_baseline:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  sql: |-
    SELECT
        HOTEL_CODE AS hotel_code,

        DATE_DIFF(
            'month',
            MIN(DATE),
            MAX(DATE)
        ) + 1 AS nombre_mois,

        MAX(HOTEL_NB_CHAMBRES)
            AS hotel_nb_chambres,

        MAX(HOTEL_TO_ANNUEL)
            AS hotel_to_annuel,

        MAX(HOTEL_GUESTS_PER_CHAMBRE)
            AS hotel_guests_per_chambre,

        MAX(HOTEL_NB_CHAMBRES)
            * MAX(HOTEL_TO_ANNUEL)
            * MAX(HOTEL_GUESTS_PER_CHAMBRE)
            * 30.5
            AS nombre_guests_par_mois,

        (
            MAX(HOTEL_NB_CHAMBRES)
            * MAX(HOTEL_TO_ANNUEL)
            * MAX(HOTEL_GUESTS_PER_CHAMBRE)
            * 30.5
        )
        * (
            DATE_DIFF(
                'month',
                MIN(DATE),
                MAX(DATE)
            ) + 1
        )
        AS nombre_guests,

        SUM(QUANTITE) AS nombre_ventes
    FROM
        t_sales
    GROUP BY
        HOTEL_CODE
v_sales_nature_baseline:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  - v_sales_hotel_baseline
  sql: |
    SELECT
        s.HOTEL_CODE AS hotel_code,
        s.NATURE_PRODUIT AS nature,
        SUM(s.QUANTITE) AS nature_nombre_ventes,
        SUM(s.QUANTITE)
            / NULLIF(MAX(h.nombre_ventes), 0)
            AS nature_part_nombre_ventes
    FROM
        t_sales AS s
    INNER JOIN
        v_sales_hotel_baseline AS h
    ON
        h.hotel_code = s.HOTEL_CODE
    WHERE
        s.NATURE_PRODUIT IS NOT NULL
    GROUP BY
        s.HOTEL_CODE,
        s.NATURE_PRODUIT
v_sales_removed:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  - v_scenario_removed_natures
  sql: |
    SELECT
        s.*
    FROM
        t_sales AS s
    INNER JOIN
        v_scenario_removed_natures AS r
    ON
        r.nature = s.NATURE_PRODUIT
v_sales_removed_hotel:
  type: view
  mode: create_or_replace
  requires:
  - v_sales_removed
  - v_sales_hotel_baseline
  sql: |
    SELECT
        h.hotel_code,
        COALESCE(SUM(r.QUANTITE), 0) AS nombre_ventes_retirees,
        COALESCE(SUM(r.QUANTITE), 0)
            / NULLIF(MAX(h.nombre_ventes), 0)
            AS part_ventes_retirees,
        MAX(h.nombre_ventes)
            / NULLIF(MAX(h.nombre_guests), 0)
            AS taux_conversion
    FROM
        v_sales_hotel_baseline AS h
    LEFT JOIN
        v_sales_removed AS r
    ON
        r.HOTEL_CODE = h.hotel_code
    GROUP BY
        h.hotel_code
v_sales_filtered:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  - v_scenario_removed_natures
  sql: |
    SELECT
        s.*
    FROM
        t_sales AS s
    WHERE NOT EXISTS (
        SELECT
            1
        FROM
            v_scenario_removed_natures AS r
        WHERE
            r.nature = s.NATURE_PRODUIT
    )
v_sales_current:
  type: view
  mode: create_or_replace
  requires:
  - v_sales_filtered
  - v_sales_hotel_baseline
  - v_sales_nature_baseline
  - v_sales_removed_hotel
  sql: |
    WITH v_sales_factor AS (
        SELECT
            f.*,

            (
                rh.nombre_ventes_retirees
                * rh.taux_conversion
                * nb.nature_part_nombre_ventes
            ) AS nature_nombre_ventes_ajoutees,

            (
                f.QUANTITE
                / NULLIF(nb.nature_nombre_ventes, 0)
            ) AS ligne_part_nature
        FROM
            v_sales_filtered AS f
        INNER JOIN
            v_sales_nature_baseline AS nb
        ON
            nb.hotel_code = f.HOTEL_CODE
            AND nb.nature = f.NATURE_PRODUIT
        INNER JOIN
            v_sales_removed_hotel AS rh
        ON
            rh.hotel_code = f.HOTEL_CODE
    ),
    v_sales_quantite AS (
        SELECT
            *,
            QUANTITE
                + nature_nombre_ventes_ajoutees
                * ligne_part_nature
                AS quantite_scenario
        FROM
            v_sales_factor
    )
    SELECT
        * EXCLUDE (
            QUANTITE,
            PRIX_HT,
            PRIX_TTC,
            PRIX_TTC_MARCHE,
            MARGE,
            nature_nombre_ventes_ajoutees,
            ligne_part_nature,
            quantite_scenario
        ),

        quantite_scenario AS QUANTITE,

        PRIX_HT
            * quantite_scenario
            / NULLIF(QUANTITE, 0)
            AS PRIX_HT,

        PRIX_TTC
            * quantite_scenario
            / NULLIF(QUANTITE, 0)
            AS PRIX_TTC,

        PRIX_TTC_MARCHE
            * quantite_scenario
            / NULLIF(QUANTITE, 0)
            AS PRIX_TTC_MARCHE,

        MARGE
            * quantite_scenario
            / NULLIF(QUANTITE, 0)
            AS MARGE
    FROM
        v_sales_quantite
i_iteration_scenario:
  type: iteration
  requires:
  - t_scenarios
  scenarios: t_scenarios
  step_view: v_scenario_step
  target: x_insert_dataset_pivot
  order_by:
  - scenario_id
