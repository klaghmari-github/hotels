# =============================================================================
# CLASSEMENTS DES NATURES DE PRODUIT ET DES GROUPES
#
# Principe :
# - la nature de produit est la granularité atomique de suppression ;
# - tous les classements sont calculés par hôtel ;
# - la marge la plus faible est classée en premier ;
# - les tables de groupes contiennent directement la liste des natures
#   correspondantes afin de simplifier la fonction de suppression.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Classement global des natures de produit
# -----------------------------------------------------------------------------

t_rank_nature:
  type: table
  requires:
    - t_sales
  sql: |
    WITH t_nature_marge AS (
        SELECT
            HOTEL_CODE AS hotel_code,
            NATURE_PRODUIT AS nature,
            SUM(MARGE) AS montant_marge
        FROM
            t_sales
        WHERE
            NATURE_PRODUIT IS NOT NULL
        GROUP BY
            HOTEL_CODE,
            NATURE_PRODUIT
    )
    SELECT
        hotel_code,
        nature,
        montant_marge,
        ROW_NUMBER() OVER (
            PARTITION BY hotel_code
            ORDER BY montant_marge, nature
        ) AS rang_nature
    FROM
        t_nature_marge
    ORDER BY
        hotel_code,
        rang_nature


# -----------------------------------------------------------------------------
# 2. Classement des natures à l'intérieur de chaque groupe
# -----------------------------------------------------------------------------

t_rank_nature_by_categorie:
  type: table
  requires:
    - t_sales
  sql: |
    WITH t_nature_marge AS (
        SELECT
            HOTEL_CODE AS hotel_code,
            CATEGORIE AS categorie,
            NATURE_PRODUIT AS nature,
            SUM(MARGE) AS montant_marge
        FROM
            t_sales
        WHERE
            CATEGORIE IS NOT NULL
            AND NATURE_PRODUIT IS NOT NULL
        GROUP BY
            HOTEL_CODE,
            CATEGORIE,
            NATURE_PRODUIT
    )
    SELECT
        hotel_code,
        categorie,
        nature,
        montant_marge,
        ROW_NUMBER() OVER (
            PARTITION BY hotel_code, categorie
            ORDER BY montant_marge, nature
        ) AS rang_nature
    FROM
        t_nature_marge
    ORDER BY
        hotel_code,
        categorie,
        rang_nature


