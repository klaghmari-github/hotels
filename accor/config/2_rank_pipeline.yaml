t_rank_nature:
  type: view
  requires:
  - t_sales
  sql: |
    WITH t_nature_marge AS (
        SELECT
            HOTEL_CODE AS hotel_code,
            NATURE_PRODUIT AS nature,
            SUM(MARGE) AS montant_marge
        FROM
            t_sales
        WHERE
            NATURE_PRODUIT IS NOT NULL
        GROUP BY
            HOTEL_CODE,
            NATURE_PRODUIT
    )
    SELECT
        hotel_code,
        nature,
        montant_marge,
        ROW_NUMBER() OVER (
            PARTITION BY hotel_code
            ORDER BY montant_marge, nature
        ) AS rang_nature
    FROM
        t_nature_marge
    ORDER BY
        hotel_code,
        rang_nature
  mode: create_or_replace
