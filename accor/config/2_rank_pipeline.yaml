            NATURE_PRODUIT AS nature,
            SUM(MARGE) AS montant_marge
        FROM
            t_sales
        WHERE
            CATEGORIE IS NOT NULL
            AND NATURE_PRODUIT IS NOT NULL
        GROUP BY
            HOTEL_CODE,
            CATEGORIE,
            NATURE_PRODUIT
    )
    SELECT
        hotel_code,
        categorie,
        nature,
        montant_marge,
        ROW_NUMBER() OVER (
            PARTITION BY hotel_code, categorie
            ORDER BY montant_marge, nature
        ) AS rang_nature
    FROM
        t_nature_marge
    ORDER BY
        hotel_code,
        categorie,
        rang_nature
  mode: create_or_replace
