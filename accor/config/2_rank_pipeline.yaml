t_rank_categorie:
  type: view
  requires:
  - t_rank_nature_by_categorie
  sql: |
    WITH t_categorie AS (
        SELECT
            hotel_code,
            categorie,
            SUM(montant_marge) AS montant_marge,
            COUNT(*) AS nombre_natures,
            LIST(nature ORDER BY rang_nature) AS natures
        FROM
            t_rank_nature_by_categorie
        GROUP BY
            hotel_code,
            categorie
    )
    SELECT
        hotel_code,
        categorie,
        montant_marge,
        nombre_natures,
        natures,
        ROW_NUMBER() OVER (
            PARTITION BY hotel_code
