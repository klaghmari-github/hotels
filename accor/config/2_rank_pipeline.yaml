# -----------------------------------------------------------------------------
# 3. Classement des éléments de chaque groupe
#
# Chaque ligne contient :
# - la marge totale de l'élément ;
# - le nombre de natures de l'élément ;
# - la liste des natures déjà classées par marge croissante ;
# - le rang de l'élément dans l'hôtel.
# -----------------------------------------------------------------------------

t_rank_categorie:
  type: table
  requires:
    - t_rank_nature_by_categorie
  sql: |
    WITH t_categorie AS (
        SELECT
            hotel_code,
            categorie,
            SUM(montant_marge) AS montant_marge,
            COUNT(*) AS nombre_natures,
            LIST(nature ORDER BY rang_nature) AS natures
        FROM
            t_rank_nature_by_categorie
        GROUP BY
            hotel_code,
            categorie
    )
    SELECT
        hotel_code,
        categorie,
        montant_marge,
        nombre_natures,
        natures,
        ROW_NUMBER() OVER (
            PARTITION BY hotel_code
            ORDER BY montant_marge, categorie
        ) AS rang_categorie
    FROM
        t_categorie
    ORDER BY
        hotel_code,
        rang_categorie


