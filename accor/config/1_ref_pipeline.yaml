t_hotel_codes:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  sql: |
    SELECT DISTINCT
        HOTEL_CODE
    FROM
        t_sales
    ORDER BY
        HOTEL_CODE
t_machines:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  sql: |
    SELECT DISTINCT
        MACHINE
    FROM
        t_sales
    WHERE
        MACHINE IS NOT NULL
    ORDER BY
        MACHINE
