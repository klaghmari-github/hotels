# =============================================================================
# DATASETS DE MODELISATION HOTEL
#
# Grain final :
# - une ligne par HOTEL_CODE ;
# - valeurs d'activité mensualisées ;
# - structure et mix d'exposition non mensualisés ;
# - solution et mètres linéaires issus des valeurs de référence.
#
# Hypothèses de la source t_sales :
# - une ligne correspond à une vente d'une nature de produit ;
# - NATURE_PRODUIT est la granularité atomique d'exposition ;
# - NOMBRE_GUESTS est sommable sur la période ;
# - PRIX_TTC représente le montant TTC à agréger ;
# - MARGE représente la marge à agréger.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Valeurs de référence de l'hôtel
# -----------------------------------------------------------------------------

t_dataset_ref:
  type: table
  requires:
    - t_sales
  sql: |
    SELECT
        HOTEL_CODE AS hotel_code,
        ANY_VALUE(SOLUTION) AS solution,
        ANY_VALUE(METRES_LINEAIRES) AS metres_lineaires
    FROM
        t_sales
    GROUP BY
        HOTEL_CODE
    ORDER BY
        HOTEL_CODE


# -----------------------------------------------------------------------------
# 2. Observation totale de l'activité avant mensualisation
#
# nombre_ventes = nombre de lignes de vente.
# Une ligne représentant une vente de nature, COUNT(*) est volontairement
# utilisé à la place de SUM(QUANTITE).
# -----------------------------------------------------------------------------

t_dataset_observation_total:
  type: table
  requires:
    - t_sales
  sql: |
    SELECT
        HOTEL_CODE AS hotel_code,

        DATE_DIFF(
            'month',
            MIN(DATE),
            MAX(DATE)
        ) + 1 AS nombre_mois,

        SUM(NOMBRE_GUESTS) AS nombre_guests,
        COUNT(*) AS nombre_ventes,
        SUM(PRIX_TTC) AS montant_ventes,
        SUM(MARGE) AS montant_marge
    FROM
        t_sales
    GROUP BY
        HOTEL_CODE
    ORDER BY
        HOTEL_CODE


# -----------------------------------------------------------------------------
# 3. Observation mensualisée
#
# Tous les champs situés après nombre_mois sont divisés par nombre_mois
# et reçoivent le suffixe _par_mois.
# -----------------------------------------------------------------------------

t_dataset_observation_par_mois:
  type: table
  requires:
    - t_dataset_observation_total
  sql: |
    SELECT
        hotel_code,
        nombre_mois,

        nombre_guests
            / NULLIF(nombre_mois, 0)
            AS nombre_guests_par_mois,

        nombre_ventes
            / NULLIF(nombre_mois, 0)
            AS nombre_ventes_par_mois,

        montant_ventes
            / NULLIF(nombre_mois, 0)
            AS montant_ventes_par_mois,

        montant_marge
            / NULLIF(nombre_mois, 0)
            AS montant_marge_par_mois
    FROM
        t_dataset_observation_total
    ORDER BY
        hotel_code


# -----------------------------------------------------------------------------
# 4. Mix d'exposition en nombres
# -----------------------------------------------------------------------------


# 4.1 Comptages globaux et comptages par famille de groupes

t_dataset_mix_nombre_global:
  type: table
  requires:
    - t_sales
  sql: |
    SELECT
        HOTEL_CODE AS hotel_code,

        COUNT(DISTINCT NATURE_PRODUIT)
            AS nombre_natures,

        COUNT(DISTINCT CATEGORIE)
            AS nombre_categories,

        COUNT(DISTINCT GAMME)
            AS nombre_gammes,

        COUNT(DISTINCT TYPE)
            AS nombre_types,

        COUNT(DISTINCT MARQUE)
            AS nombre_marques,

        COUNT(DISTINCT FOURNISSEUR)
            AS nombre_fournisseurs,

        COUNT(DISTINCT CASE
            WHEN CATEGORIE IS NOT NULL
            THEN NATURE_PRODUIT
        END) AS categories_nombre_natures,

        COUNT(DISTINCT CASE
            WHEN GAMME IS NOT NULL
            THEN NATURE_PRODUIT
        END) AS gammes_nombre_natures,

        COUNT(DISTINCT CASE
            WHEN TYPE IS NOT NULL
            THEN NATURE_PRODUIT
        END) AS types_nombre_natures,

        COUNT(DISTINCT CASE
            WHEN MARQUE IS NOT NULL
            THEN NATURE_PRODUIT
        END) AS marques_nombre_natures,

        COUNT(DISTINCT CASE
            WHEN FOURNISSEUR IS NOT NULL
            THEN NATURE_PRODUIT
        END) AS fournisseurs_nombre_natures
    FROM
        t_sales
    GROUP BY
        HOTEL_CODE
    ORDER BY
        HOTEL_CODE


# 4.2 Format long des nombres de natures par élément de groupe
#
# La clé metric_name est déjà construite sous la forme finale attendue :
# categorie_<cat>_nombre_natures
# gamme_<gamme>_nombre_natures
# type_<type>_nombre_natures
# marque_<marque>_nombre_natures
# fournisseur_<fournisseur>_nombre_natures

t_dataset_mix_nombre_long:
  type: table
  requires:
    - t_sales
  sql: |
    SELECT
        HOTEL_CODE AS hotel_code,
        'categorie_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(CATEGORIE AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
            AS metric_name,
        COUNT(DISTINCT NATURE_PRODUIT)
            AS metric_value
    FROM
        t_sales
    WHERE
        CATEGORIE IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        CATEGORIE

    UNION ALL

    SELECT
        HOTEL_CODE AS hotel_code,
        'gamme_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(GAMME AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
            AS metric_name,
        COUNT(DISTINCT NATURE_PRODUIT)
            AS metric_value
    FROM
        t_sales
    WHERE
        GAMME IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        GAMME

    UNION ALL

    SELECT
        HOTEL_CODE AS hotel_code,
        'type_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(TYPE AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
            AS metric_name,
        COUNT(DISTINCT NATURE_PRODUIT)
            AS metric_value
    FROM
        t_sales
    WHERE
        TYPE IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        TYPE

    UNION ALL

    SELECT
        HOTEL_CODE AS hotel_code,
        'marque_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(MARQUE AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
            AS metric_name,
        COUNT(DISTINCT NATURE_PRODUIT)
            AS metric_value
    FROM
        t_sales
    WHERE
        MARQUE IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        MARQUE

    UNION ALL

    SELECT
        HOTEL_CODE AS hotel_code,
        'fournisseur_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(FOURNISSEUR AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
            AS metric_name,
        COUNT(DISTINCT NATURE_PRODUIT)
            AS metric_value
    FROM
        t_sales
    WHERE
        FOURNISSEUR IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        FOURNISSEUR


# 4.3 Pivot dynamique des nombres de natures par élément

t_dataset_mix_nombre_detail:
  type: table
  requires:
    - t_dataset_mix_nombre_long
  sql: |
    PIVOT t_dataset_mix_nombre_long
    ON metric_name
    USING MAX(metric_value)
    GROUP BY hotel_code


# 4.4 Dataset complet du mix en nombres

t_dataset_mix_nombre:
  type: table
  requires:
    - t_dataset_mix_nombre_global
    - t_dataset_mix_nombre_detail
  sql: |
    SELECT
        g.*,
        d.* EXCLUDE (hotel_code)
    FROM
        t_dataset_mix_nombre_global AS g
    LEFT JOIN
        t_dataset_mix_nombre_detail AS d
    USING
        (hotel_code)
    ORDER BY
        hotel_code


# -----------------------------------------------------------------------------
# 5. Mix d'exposition en pourcentages
# -----------------------------------------------------------------------------


# 5.1 Pourcentages globaux par famille de groupes

t_dataset_mix_pourcentage_global:
  type: table
  requires:
    - t_dataset_mix_nombre_global
  sql: |
    SELECT
        hotel_code,
        nombre_natures,

        categories_nombre_natures
            / NULLIF(nombre_natures, 0)
            AS categories_part_natures,

        gammes_nombre_natures
            / NULLIF(nombre_natures, 0)
            AS gammes_part_natures,

        types_nombre_natures
            / NULLIF(nombre_natures, 0)
            AS types_part_natures,

        marques_nombre_natures
            / NULLIF(nombre_natures, 0)
            AS marques_part_natures,

        fournisseurs_nombre_natures
            / NULLIF(nombre_natures, 0)
            AS fournisseurs_part_natures
    FROM
        t_dataset_mix_nombre_global
    ORDER BY
        hotel_code


# 5.2 Format long des pourcentages par élément de groupe

t_dataset_mix_pourcentage_long:
  type: table
  requires:
    - t_dataset_mix_nombre_long
    - t_dataset_mix_nombre_global
  sql: |
    SELECT
        l.hotel_code,

        REGEXP_REPLACE(
            l.metric_name,
            '_nombre_natures$',
            '_part_natures'
        ) AS metric_name,

        l.metric_value
            / NULLIF(g.nombre_natures, 0)
            AS metric_value
    FROM
        t_dataset_mix_nombre_long AS l
    LEFT JOIN
        t_dataset_mix_nombre_global AS g
    USING
        (hotel_code)


# 5.3 Pivot dynamique des pourcentages par élément

t_dataset_mix_pourcentage_detail:
  type: table
  requires:
    - t_dataset_mix_pourcentage_long
  sql: |
    PIVOT t_dataset_mix_pourcentage_long
    ON metric_name
    USING MAX(metric_value)
    GROUP BY hotel_code


# 5.4 Dataset complet du mix en pourcentages

t_dataset_mix_pourcentage:
  type: table
  requires:
    - t_dataset_mix_pourcentage_global
    - t_dataset_mix_pourcentage_detail
  sql: |
    SELECT
        g.*,
        d.* EXCLUDE (hotel_code)
    FROM
        t_dataset_mix_pourcentage_global AS g
    LEFT JOIN
        t_dataset_mix_pourcentage_detail AS d
    USING
        (hotel_code)
    ORDER BY
        hotel_code


# -----------------------------------------------------------------------------
# 6. Dataset pivot final pour la modélisation
#
# Une ligne par hôtel avec :
# - solution et mètres linéaires ;
# - activité mensualisée à prédire ;
# - mix d'exposition en nombres ;
# - mix d'exposition en pourcentages.
# -----------------------------------------------------------------------------

t_dataset_pivot:
  type: table
  requires:
    - t_dataset_ref
    - t_dataset_observation_par_mois
    - t_dataset_mix_nombre
    - t_dataset_mix_pourcentage
  sql: |
    SELECT
        r.hotel_code,
        r.solution,
        r.metres_lineaires,

        o.* EXCLUDE (hotel_code),

        mn.* EXCLUDE (hotel_code),

        mp.* EXCLUDE (
            hotel_code,
            nombre_natures
        )
    FROM
        t_dataset_ref AS r
    LEFT JOIN
        t_dataset_observation_par_mois AS o
    USING
        (hotel_code)
    LEFT JOIN
        t_dataset_mix_nombre AS mn
    USING
        (hotel_code)
    LEFT JOIN
        t_dataset_mix_pourcentage AS mp
    USING
        (hotel_code)
    ORDER BY
        r.hotel_code
