v_dataset_ref:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  sql: |
    SELECT
        HOTEL_CODE AS hotel_code,
        ANY_VALUE(SOLUTION) AS solution,
        ANY_VALUE(METRES_LINEAIRES) AS metres_lineaires
    FROM
        t_sales
    GROUP BY
        HOTEL_CODE
    ORDER BY
        HOTEL_CODE
v_dataset_observation_context:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  sql: |-
    SELECT
        HOTEL_CODE AS hotel_code,

        DATE_DIFF(
            'month',
            MIN(DATE),
            MAX(DATE)
        ) + 1 AS nombre_mois,

        MAX(HOTEL_NB_CHAMBRES)
            AS hotel_nb_chambres,

        MAX(HOTEL_TO_ANNUEL)
            AS hotel_to_annuel,

        MAX(HOTEL_GUESTS_PER_CHAMBRE)
            AS hotel_guests_per_chambre,

        MAX(HOTEL_NB_CHAMBRES)
            * MAX(HOTEL_TO_ANNUEL)
            * MAX(HOTEL_GUESTS_PER_CHAMBRE)
            * 30.5
            AS nombre_guests_par_mois,

        (
            MAX(HOTEL_NB_CHAMBRES)
            * MAX(HOTEL_TO_ANNUEL)
            * MAX(HOTEL_GUESTS_PER_CHAMBRE)
            * 30.5
        )
        * (
            DATE_DIFF(
                'month',
                MIN(DATE),
                MAX(DATE)
            ) + 1
        )
        AS nombre_guests
    FROM
        t_sales
    GROUP BY
        HOTEL_CODE
v_dataset_observation_activity:
  type: view
  mode: create_or_replace
  requires:
  - v_sales_current
  sql: |
    SELECT
        HOTEL_CODE AS hotel_code,
        SUM(QUANTITE) AS nombre_ventes,
        SUM(PRIX_TTC) AS montant_ventes,
        SUM(MARGE) AS montant_marge
    FROM
        v_sales_current
    GROUP BY
        HOTEL_CODE
v_dataset_observation_total:
  type: view
  mode: create_or_replace
  requires:
  - v_dataset_observation_context
  - v_dataset_observation_activity
  sql: |-
    SELECT
        c.hotel_code,
        c.nombre_mois,
        c.nombre_guests,
        a.nombre_ventes,
        a.montant_ventes,
        a.montant_marge
    FROM
        v_dataset_observation_context AS c
    LEFT JOIN
        v_dataset_observation_activity AS a
    USING
        (hotel_code)
    ORDER BY
        c.hotel_code
v_dataset_observation_par_mois:
  type: view
  mode: create_or_replace
  requires:
  - v_dataset_observation_total
  sql: |
    SELECT
        hotel_code,
        nombre_mois,

        nombre_guests
            / NULLIF(nombre_mois, 0)
            AS nombre_guests_par_mois,

        nombre_ventes
            / NULLIF(nombre_mois, 0)
            AS nombre_ventes_par_mois,

        montant_ventes
            / NULLIF(nombre_mois, 0)
            AS montant_ventes_par_mois,

        montant_marge
            / NULLIF(nombre_mois, 0)
            AS montant_marge_par_mois
    FROM
        v_dataset_observation_total
    ORDER BY
        hotel_code
v_dataset_mix_nombre_global:
  type: view
  mode: create_or_replace
  requires:
  - v_sales_current
  sql: |
    SELECT
        HOTEL_CODE AS hotel_code,
        COUNT(DISTINCT NATURE_PRODUIT) AS nombre_natures,
        COUNT(DISTINCT CATEGORIE) AS nombre_categories,
        COUNT(DISTINCT GAMME) AS nombre_gammes,
        COUNT(DISTINCT TYPE) AS nombre_types,
        COUNT(DISTINCT MARQUE) AS nombre_marques,
        COUNT(DISTINCT FOURNISSEUR) AS nombre_fournisseurs
    FROM
        v_sales_current
    GROUP BY
        HOTEL_CODE
    ORDER BY
        HOTEL_CODE
v_dataset_mix_metric_names:
  type: view
  mode: create_or_replace
  requires:
  - t_sales
  sql: |
    SELECT DISTINCT
        'categorie_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(CATEGORIE AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
            AS metric_name
    FROM
        t_sales
    WHERE
        CATEGORIE IS NOT NULL

    UNION

    SELECT DISTINCT
        'gamme_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(GAMME AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
    FROM
        t_sales
    WHERE
        GAMME IS NOT NULL

    UNION

    SELECT DISTINCT
        'type_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(TYPE AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
    FROM
        t_sales
    WHERE
        TYPE IS NOT NULL

    UNION

    SELECT DISTINCT
        'marque_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(MARQUE AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
    FROM
        t_sales
    WHERE
        MARQUE IS NOT NULL

    UNION

    SELECT DISTINCT
        'fournisseur_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(FOURNISSEUR AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
    FROM
        t_sales
    WHERE
        FOURNISSEUR IS NOT NULL
v_dataset_mix_nombre_observed_long:
  type: view
  mode: create_or_replace
  requires:
  - v_sales_current
  sql: |
    SELECT
        HOTEL_CODE AS hotel_code,
        'categorie_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(CATEGORIE AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures'
            AS metric_name,
        COUNT(DISTINCT NATURE_PRODUIT) AS metric_value
    FROM
        v_sales_current
    WHERE
        CATEGORIE IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        CATEGORIE

    UNION ALL

    SELECT
        HOTEL_CODE,
        'gamme_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(GAMME AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures',
        COUNT(DISTINCT NATURE_PRODUIT)
    FROM
        v_sales_current
    WHERE
        GAMME IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        GAMME

    UNION ALL

    SELECT
        HOTEL_CODE,
        'type_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(TYPE AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures',
        COUNT(DISTINCT NATURE_PRODUIT)
    FROM
        v_sales_current
    WHERE
        TYPE IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        TYPE

    UNION ALL

    SELECT
        HOTEL_CODE,
        'marque_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(MARQUE AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures',
        COUNT(DISTINCT NATURE_PRODUIT)
    FROM
        v_sales_current
    WHERE
        MARQUE IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        MARQUE

    UNION ALL

    SELECT
        HOTEL_CODE,
        'fournisseur_'
            || TRIM(BOTH '_' FROM REGEXP_REPLACE(
                LOWER(CAST(FOURNISSEUR AS VARCHAR)),
                '[^a-z0-9]+',
                '_',
                'g'
            ))
            || '_nombre_natures',
        COUNT(DISTINCT NATURE_PRODUIT)
    FROM
        v_sales_current
    WHERE
        FOURNISSEUR IS NOT NULL
        AND NATURE_PRODUIT IS NOT NULL
    GROUP BY
        HOTEL_CODE,
        FOURNISSEUR
v_dataset_mix_nombre_long:
  type: view
  mode: create_or_replace
  requires:
  - t_hotel_codes
  - v_dataset_mix_metric_names
  - v_dataset_mix_nombre_observed_long
  sql: |
    SELECT
        h.HOTEL_CODE AS hotel_code,
        m.metric_name,
        COALESCE(o.metric_value, 0) AS metric_value
    FROM
        t_hotel_codes AS h
    CROSS JOIN
        v_dataset_mix_metric_names AS m
    LEFT JOIN
        v_dataset_mix_nombre_observed_long AS o
    ON
        o.hotel_code = h.HOTEL_CODE
        AND o.metric_name = m.metric_name
v_dataset_mix_nombre_detail:
  type: view
  mode: create_or_replace
  requires:
  - v_dataset_mix_nombre_long
  sql: |
    PIVOT v_dataset_mix_nombre_long
    ON metric_name
    USING MAX(metric_value)
    GROUP BY hotel_code
v_dataset_mix_nombre:
  type: view
  mode: create_or_replace
  requires:
  - v_dataset_mix_nombre_global
  - v_dataset_mix_nombre_detail
  sql: |
    SELECT
        g.*,
        d.* EXCLUDE (hotel_code)
    FROM
        v_dataset_mix_nombre_global AS g
    LEFT JOIN
        v_dataset_mix_nombre_detail AS d
    USING
        (hotel_code)
    ORDER BY
        hotel_code
v_dataset_mix_pourcentage_long:
  type: view
  mode: create_or_replace
  requires:
  - v_dataset_mix_nombre_long
  - v_dataset_mix_nombre_global
  sql: |
    SELECT
        l.hotel_code,

        REGEXP_REPLACE(
            l.metric_name,
            '_nombre_natures$',
            '_part_natures'
        ) AS metric_name,

        l.metric_value
            / NULLIF(g.nombre_natures, 0)
            AS metric_value
    FROM
        v_dataset_mix_nombre_long AS l
    INNER JOIN
        v_dataset_mix_nombre_global AS g
    USING
        (hotel_code)
v_dataset_mix_pourcentage_detail:
  type: view
  mode: create_or_replace
  requires:
  - v_dataset_mix_pourcentage_long
  sql: |
    PIVOT v_dataset_mix_pourcentage_long
    ON metric_name
    USING MAX(metric_value)
    GROUP BY hotel_code
v_dataset_mix_pourcentage:
  type: view
  mode: create_or_replace
  requires:
  - v_dataset_mix_nombre_global
  - v_dataset_mix_pourcentage_detail
  sql: |
    SELECT
        g.hotel_code,
        g.nombre_natures,
        d.* EXCLUDE (hotel_code)
    FROM
        v_dataset_mix_nombre_global AS g
    LEFT JOIN
        v_dataset_mix_pourcentage_detail AS d
    USING
        (hotel_code)
    ORDER BY
        g.hotel_code
v_dataset_pivot:
  type: view
  mode: create_or_replace
  requires:
  - v_dataset_ref
  - v_dataset_observation_par_mois
  - v_dataset_mix_nombre
  - v_dataset_mix_pourcentage
  sql: |
    SELECT
        s.scenario_id,
        s.scenario_removed_natures,

        r.hotel_code,
        r.solution,
        r.metres_lineaires,

        o.* EXCLUDE (hotel_code),

        mn.* EXCLUDE (hotel_code),

        mp.* EXCLUDE (
            hotel_code,
            nombre_natures
        )
    FROM
        v_dataset_ref AS r
    CROSS JOIN
        v_scenario_step AS s
    LEFT JOIN
        v_dataset_observation_par_mois AS o
    USING
        (hotel_code)
    LEFT JOIN
        v_dataset_mix_nombre AS mn
    USING
        (hotel_code)
    LEFT JOIN
        v_dataset_mix_pourcentage AS mp
    USING
        (hotel_code)
    ORDER BY
        r.hotel_code
t_dataset_pivot:
  type: table
  mode: create_if_not_exists
  requires:
  - v_dataset_pivot
  sql: |
    SELECT
        *
    FROM
        v_dataset_pivot
    LIMIT 0
x_insert_dataset_pivot:
  type: execute
  requires:
  - t_dataset_pivot
  - v_dataset_pivot
  sql: |
    INSERT INTO
        t_dataset_pivot BY NAME
    SELECT
        p.*
    FROM
        v_dataset_pivot AS p
    WHERE NOT EXISTS (
        SELECT
            1
        FROM
            t_dataset_pivot AS t
        WHERE
            t.scenario_id = p.scenario_id
            AND t.hotel_code = p.hotel_code
    )
