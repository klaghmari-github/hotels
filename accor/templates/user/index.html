<!DOCTYPE html>
<!--
  ROD · Simulateur directeur (user :5056)

  Même moteur que l'admin (ref catégorie train, corner, 3 concepts + reco).
  UX : résultats grands / lisibles, onglets, recalcul auto (pas de bouton Simuler).
  Front : static/user/js/modules/app.js
  API  : POST /api/rod/simulate, GET /api/rod/meta, /api/hotels/*
-->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROD · Simulateur Directeur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ asset('shared/css/tokens.css') }}" />
  <link rel="stylesheet" href="{{ asset('user/css/user.css') }}" />
</head>
<body>
  <div class="dir-shell">
    <header class="dir-top">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <strong>ROD</strong>
          <span class="brand-sub">Retail On Demand · Directeur</span>
        </div>
      </div>
      <div class="dir-top-right">
        <span class="status" id="dir-status"></span>
        <span class="pill">User</span>
      </div>
    </header>

    <div class="dir-layout">
      <!-- ===== Contrôles (gauche) ===== -->
      <aside class="dir-side">
        <section class="dir-card">
          <h2 class="dir-card-title">Votre hôtel</h2>
          <label class="field ac-wrap">
            <span>Code ou nom</span>
            <input id="hotel_search" type="text" placeholder="H0373, ibis Paris…" autocomplete="off" />
            <ul id="ac-hotels" class="ac-list hidden" role="listbox"></ul>
          </label>
          <input type="hidden" id="hotel_code" />
          <div id="hotel-summary" class="hotel-summary empty">Choisissez un hôtel</div>
        </section>

        <section class="dir-card">
          <h2 class="dir-card-title">Exploitation</h2>
          <div class="dir-kpi-inputs">
            <label class="field">
              <span>Chambres</span>
              <input id="nb_chambres" type="number" min="1" max="2000" step="1" />
            </label>
            <label class="field">
              <span>TO %</span>
              <input id="taux_occupation" type="number" min="1" max="100" step="0.1" />
            </label>
            <label class="field">
              <span>Guests / ch</span>
              <input id="guests_per_chambre" type="number" min="0.5" max="5" step="0.1" />
            </label>
          </div>
        </section>

        <section class="dir-card">
          <h2 class="dir-card-title">Corner</h2>
          <label class="field">
            <span>Mètres linéaires <strong id="m-lin-val">6</strong></span>
            <div class="slider-row">
              <input type="range" id="m_lin_slider" min="1" max="40" step="0.5" value="6" />
              <input type="number" id="m_lin" min="1" max="40" step="0.5" value="6" />
            </div>
          </label>
          <label class="field">
            <span>Mix F&amp;B <strong id="mix-val">70</strong> % · N-F&amp;B <strong id="mix-nf-val">30</strong> %</span>
            <div class="slider-row">
              <input type="range" id="mix_slider" min="0" max="100" step="1" value="70" />
              <input type="number" id="mix_fb" min="0" max="100" step="1" value="70" />
            </div>
          </label>
        </section>

        <section class="dir-card dir-card-needs">
          <div class="dir-card-head">
            <h2 class="dir-card-title">Sous-catégories</h2>
            <div class="needs-actions">
              <button type="button" class="btn-text" id="needs-all-on">Tout</button>
              <button type="button" class="btn-text" id="needs-all-off">Rien</button>
            </div>
          </div>
          <div class="needs-cols">
            <div>
              <h3 class="needs-h">F&amp;B</h3>
              <div id="needs-fb" class="needs-list"></div>
            </div>
            <div>
              <h3 class="needs-h">N-F&amp;B</h3>
              <div id="needs-nfb" class="needs-list"></div>
            </div>
          </div>
        </section>
      </aside>

      <!-- ===== Résultats (droite) ===== -->
      <main class="dir-main">
        <div id="dir-empty" class="dir-empty">
          <p class="dir-empty-title">Simulation corner</p>
          <p class="dir-empty-sub">Sélectionnez un hôtel pour estimer CA, coûts et solution recommandée.</p>
        </div>

        <div id="dir-results" class="dir-results hidden">
          <!-- Hero reco -->
          <section id="dir-hero" class="dir-hero">
            <div class="dir-hero-tag">Solution recommandée</div>
            <h1 id="dir-reco-name">—</h1>
            <p id="dir-hotel-line" class="dir-hotel-line"></p>
          </section>

          <!-- Gros chiffres solution reco -->
          <section class="dir-big-metrics" id="dir-big-metrics"></section>

          <!-- Sélecteur concept + onglets -->
          <div class="dir-toolbar">
            <div class="concept-pills" id="concept-pills">
              <button type="button" class="concept-pill" data-concept="SIMPLY">SIMPLY</button>
              <button type="button" class="concept-pill" data-concept="LIBERTY">LIBERTY</button>
              <button type="button" class="concept-pill" data-concept="CONNECTED">CONNECTED</button>
            </div>
            <div class="dir-tabs" role="tablist">
              <button type="button" class="dir-tab active" data-tab="resultat">Résultat</button>
              <button type="button" class="dir-tab" data-tab="ca">Détail CA</button>
              <button type="button" class="dir-tab" data-tab="marge">Coûts &amp; marge</button>
            </div>
          </div>

          <!-- Tab Résultat : 3 cartes concept -->
          <section class="dir-panel" data-panel="resultat">
            <div id="dir-concept-cards" class="dir-concept-cards"></div>
          </section>

          <!-- Tab CA -->
          <section class="dir-panel hidden" data-panel="ca">
            <div id="dir-ca-kpi" class="dir-panel-kpi"></div>
            <div id="dir-sales-steps" class="dir-steps"></div>
          </section>

          <!-- Tab Marge -->
          <section class="dir-panel hidden" data-panel="marge">
            <div id="dir-margin-table" class="dir-table-wrap"></div>
            <h3 class="dir-subh">Lignes de coûts — solution affichée</h3>
            <div id="dir-cost-lines" class="dir-table-wrap"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="{{ asset('user/js/modules/app.js') }}"></script>
</body>
</html>
