df_scenarios:
  type: dataframe
  requires: []
  file: /media/laghmari/ssd-data/dev/hotels/accor/data/scenarios.xlsx
t_scenarios:
  type: table
  mode: create_if_not_exists
  requires:
  - df_scenarios
  sql: "SELECT\n    CAST(scenario_id AS INTEGER) AS scenario_id,\n    FROM_JSON(\n        scenario_removed_natures_json,\n\
    \        '[\"VARCHAR\"]'\n    ) AS scenario_removed_natures\nFROM\n    df_scenarios\nORDER BY\n    scenario_id"
