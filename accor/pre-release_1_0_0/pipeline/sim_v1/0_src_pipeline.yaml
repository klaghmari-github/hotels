# Stage 0 — Sources sim_v1 (ConnectionPipeline / DuckDB)
# Chemins relatifs a la racine projet (parent de pipeline_sim_v1).

df_pilot_concepts:
  type: dataframe
  requires: []
  file: data/files/input/rod_pilot_concepts_flat.xlsx

df_pilot_defaults:
  type: dataframe
  requires: []
  file: data/files/input/v1_pilot_defaults.xlsx

df_hotel_params:
  type: dataframe
  requires: []
  file: data/files/input/v1_hotel_params.xlsx

t_pilot_concepts:
  type: table
  mode: create_or_replace
  requires:
    - df_pilot_concepts
  sql: |-
    SELECT
      CAST(hotel_code AS VARCHAR) AS hotel_code,
      UPPER(TRIM(CAST(solution AS VARCHAR))) AS solution,
      CAST(label AS VARCHAR) AS label,
      CAST(name AS VARCHAR) AS name
    FROM df_pilot_concepts
    WHERE CAST(hotel_code AS VARCHAR) IN (
      'H2075', 'HB6A3', 'H6188', 'HB5I0', 'H0373', 'H3546'
    )
      AND CAST(hotel_code AS VARCHAR) NOT IN ('H5586')
    ORDER BY solution, hotel_code

t_pilot_defaults:
  type: table
  mode: create_or_replace
  requires:
    - df_pilot_defaults
  sql: |-
    SELECT
      UPPER(TRIM(CAST(solution AS VARCHAR))) AS solution,
      TRY_CAST(nb_chambres AS DOUBLE) AS nb_chambres,
      TRY_CAST(guests AS DOUBLE) AS guests,
      TRY_CAST("to" AS DOUBLE) AS to_rate,
      TRY_CAST(ml_ref AS DOUBLE) AS ml_ref,
      TRY_CAST(frigo_ref AS DOUBLE) AS frigo_ref,
      TRY_CAST(mix_fb AS DOUBLE) AS mix_fb,
      TRY_CAST(ventes AS DOUBLE) AS ventes,
      TRY_CAST(ca_fb AS DOUBLE) AS ca_fb,
      TRY_CAST(ca_nfb AS DOUBLE) AS ca_nfb,
      TRY_CAST(ca_10_fb AS DOUBLE) AS ca_10_fb,
      TRY_CAST(ca_10_nfb AS DOUBLE) AS ca_10_nfb,
      TRY_CAST(ca_1ml_fb AS DOUBLE) AS ca_1ml_fb,
      TRY_CAST(ca_1ml_nfb AS DOUBLE) AS ca_1ml_nfb,
      TRY_CAST(ca_1frigo_fb AS DOUBLE) AS ca_1frigo_fb,
      TRY_CAST(ca_1frigo_nfb AS DOUBLE) AS ca_1frigo_nfb,
      TRY_CAST(coeff_fb AS DOUBLE) AS coeff_fb,
      TRY_CAST(coeff_nfb AS DOUBLE) AS coeff_nfb,
      TRY_CAST(clients_heb AS DOUBLE) AS clients_heb
    FROM df_pilot_defaults
    WHERE UPPER(TRIM(CAST(solution AS VARCHAR))) IN (
      'SIMPLY', 'LIBERTY', 'CONNECTED'
    )

t_hotel_params:
  type: table
  mode: create_or_replace
  requires:
    - df_hotel_params
    - t_pilot_concepts
  sql: |-
    SELECT
      CAST(h.hotel_code AS VARCHAR) AS hotel_code,
      UPPER(TRIM(CAST(h.solution AS VARCHAR))) AS solution,
      CAST(h.label AS VARCHAR) AS label,
      CAST(h.hotel_name AS VARCHAR) AS hotel_name,
      CAST(h.hotel_brand AS VARCHAR) AS hotel_brand,
      TRY_CAST(h.nb_chambres AS DOUBLE) AS nb_chambres,
      TRY_CAST(h.taux_occupation AS DOUBLE) AS taux_occupation,
      TRY_CAST(h.guests_per_chambre AS DOUBLE) AS guests_per_chambre,
      TRY_CAST(h.m_lin AS DOUBLE) AS m_lin,
      COALESCE(TRY_CAST(h.nb_frigos_froid AS DOUBLE), 3.0) AS nb_frigos_froid,
      TRY_CAST(h.clients_mois AS DOUBLE) AS clients_mois,
      TRY_CAST(h.mix_fb AS DOUBLE) AS mix_fb,
      TRY_CAST(h.ca_reel_mensuel AS DOUBLE) AS ca_reel_mensuel,
      TRY_CAST(h.ca_fb_mensuel AS DOUBLE) AS ca_fb_mensuel,
      TRY_CAST(h.ca_nf_mensuel AS DOUBLE) AS ca_nf_mensuel,
      TRY_CAST(h.marge_reelle_mensuelle AS DOUBLE) AS marge_reelle_mensuelle,
      TRY_CAST(h.nb_ventes_mensuel AS DOUBLE) AS nb_ventes_mensuel,
      TRY_CAST(h.nb_paniers_mensuel AS DOUBLE) AS nb_paniers_mensuel,
      TRY_CAST(h.n_mois AS DOUBLE) AS n_mois
    FROM df_hotel_params AS h
    INNER JOIN t_pilot_concepts AS p
      ON CAST(h.hotel_code AS VARCHAR) = p.hotel_code
    WHERE CAST(h.hotel_code AS VARCHAR) NOT IN ('H5586')

t_scope_hotels:
  type: table
  mode: create_or_replace
  requires:
    - t_hotel_params
  sql: |-
    SELECT
      hotel_code,
      solution,
      label,
      hotel_name AS name
    FROM t_hotel_params
    ORDER BY solution, hotel_code
