<?xml version="1.0" encoding="UTF-8"?>
<!-- Marque renatus (icone seule, sans wordmark) — d apres logo officiel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="renatus">
  <defs>
    <linearGradient id="ring" x1="20" y1="220" x2="240" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#2dd4bf"/>
